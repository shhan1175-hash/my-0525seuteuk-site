/* ══════════════════════════════════════════
   멀티 AI 엔진 호출
   Claude  → x-api-key 헤더
   Gemini  → URL ?key= 파라미터 (x-api-key 불가)
   ChatGPT → Authorization: Bearer 헤더
   GPT-4o Vision (OCR) → OpenAI images 엔드포인트
══════════════════════════════════════════ */
async function callAI(prompt,engine,keys){
  if(engine==="Claude"){
    const key=keys.claude;if(!key)throw new Error("Claude API 키가 없습니다.");
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1200,messages:[{role:"user",content:prompt}]})});
    const d=await res.json();if(d.error)throw new Error(d.error.message);
    return(d.content||[]).map(x=>x.text||"").join("")||"생성 결과 없음";
  }
  if(engine==="Gemini"){
    const key=keys.gemini;if(!key)throw new Error("Gemini API 키가 없습니다.");
    const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`;
    const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:1200}})});
    const d=await res.json();if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
    return d.candidates?.[0]?.content?.parts?.[0]?.text||"생성 결과 없음";
  }
  if(engine==="ChatGPT"){
    const key=keys.openai;if(!key)throw new Error("OpenAI API 키가 없습니다.");
    const res=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},
      body:JSON.stringify({model:"gpt-4o",max_tokens:1200,messages:[{role:"user",content:prompt}]})});
    const d=await res.json();if(d.error)throw new Error(d.error.message);
    return d.choices?.[0]?.message?.content||"생성 결과 없음";
  }
  throw new Error("알 수 없는 AI 엔진");
}

/* GPT-4o Vision OCR — OpenAI Vision API */
async function runGPTVisionOCR(imgDataUrl,openaiKey){
  if(!openaiKey)throw new Error("OCR에 OpenAI(GPT-4o) API 키가 필요합니다. 환경설정에서 입력해 주세요.");
  const b64=imgDataUrl.split(",")[1];
  const mt=imgDataUrl.match(/data:(image\/\w+);/)?.[1]||"image/jpeg";
  const res=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`Bearer ${openaiKey}`},
    body:JSON.stringify({model:"gpt-4o",max_tokens:1000,messages:[{role:"user",content:[
      {type:"image_url",image_url:{url:`data:${mt};base64,${b64}`}},
      {type:"text",text:"이 이미지에 있는 텍스트를 정확하게 추출해 주세요. 시나 지문이라면 원문 그대로 옮겨 주세요. 수식·기호도 포함하여 텍스트만 출력하고 다른 설명은 하지 마세요."}
    ]}]})});
  const d=await res.json();if(d.error)throw new Error(d.error.message);
  return d.choices?.[0]?.message?.content||"";
}

          <aside style={{width:215,flexShrink:0,background:"#fff",borderRight:`2px solid ${cv.border}`,display:"flex",flexDirection:"column",padding:"1rem 0"}}>
            {MENU.map(({k,icon,label,badge})=>(
              <div key={k} onClick={()=>setTab(k)} className={`sidebar-item${tab===k?" active":""}`}>
                {icon} {label}
                {badge>0&&<span style={{...pill(cv.lavMd,cv.ink,cv.lavMd),fontSize:".63rem",padding:".08rem .38rem",marginLeft:"auto"}}>{badge}</span>}
              </div>
            ))}
          </aside>

          <main style={{flex:1,overflowY:"auto",padding:"1.8rem 2rem"}}>

            {/* ══ 홈 (V4 신규) ══ */}
            {tab==="home"&&(
              <>
                <div style={{fontWeight:800,fontSize:"1.3rem",marginBottom:"1.4rem",color:cv.ink}}>🏠 홈</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"1.1rem",marginBottom:"1.8rem"}}>
                  {[
                    {icon:"👥",label:"학생현황",desc:"출석 체크 및 명단 관리",k:"dashboard",color:cv.lav},
                    {icon:"📋",label:"제출현황",desc:`총 ${submissions.length}건 제출됨`,k:"submissions",color:cv.mint},
                    {icon:"✏️",label:"문항설정",desc:`총 ${questions.length}개 문항`,k:"questions",color:cv.peachDk},
                    {icon:"🧠",label:"활동 분석 및 세특",desc:"AI 세특 초안 생성",k:"setk",color:cv.lav},
                    {icon:"⚙️",label:"환경설정",desc:"API키·교사 프로필 관리",k:"settings",color:cv.muted},
                  ].map(({icon,label,desc,k,color})=>(
                    <div key={k} onClick={()=>setTab(k)} style={{...crd(),cursor:"pointer",transition:"all .18s",display:"flex",alignItems:"flex-start",gap:".8rem"}} onMouseOver={e=>e.currentTarget.style.boxShadow="0 6px 24px rgba(124,92,191,.18)"} onMouseOut={e=>e.currentTarget.style.boxShadow="0 2px 14px rgba(124,92,191,.09)"}>
                      <div style={{fontSize:"1.8rem",lineHeight:1}}>{icon}</div>
                      <div><div style={{fontWeight:800,fontSize:"1rem",color,marginBottom:".2rem"}}>{label}</div><div style={{fontSize:".8rem",color:cv.muted}}>{desc}</div></div>
                    </div>
                  ))}
                </div>
                <div style={{...crd({background:cv.lavLt,border:`1.5px solid ${cv.lavMd}`})}}>
                  <div style={{fontWeight:700,marginBottom:".6rem",color:cv.ink}}>⚡ AI 엔진 현황</div>
                  <div style={{display:"flex",gap:".6rem",flexWrap:"wrap"}}>
                    {AI_ENGINES.map(eng=>(
                      <div key={eng} style={{...pill(aiEngine===eng?cv.lav:cv.bg,aiEngine===eng?"#fff":cv.muted,aiEngine===eng?cv.lav:cv.border2),fontSize:".82rem",padding:".3rem .8rem"}}>
                        {aiEngine===eng?"✅ ":""}{eng}{aiEngine===eng?" (사용중)":""}
                      </div>
                    ))}
                  </div>
                  {teacherProfile.t1Name&&<div style={{marginTop:".7rem",fontSize:".85rem",color:cv.ink2}}>
                    👤 교사 1: <strong>{teacherProfile.t1Name}</strong> ({teacherProfile.t1Subject||"과목 미설정"})
                    {teacherProfile.t2Active&&teacherProfile.t2Name&&<> &nbsp;|&nbsp; 👤 교사 2: <strong>{teacherProfile.t2Name}</strong> ({teacherProfile.t2Subject||"과목 미설정"})</>}
                  </div>}
                </div>
              </>
            )}

            {/* ══ 학생현황 ══ */}
            {tab==="dashboard"&&(
              <>
                <div style={{fontWeight:800,fontSize:"1.3rem",marginBottom:"1.4rem",color:cv.ink}}>👥 학생현황</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:"1rem",marginBottom:"1.8rem"}}>
                  {[[ROSTER.length,"재적인원",cv.lav],[presentCnt(),"출석인원",cv.mint],[absentCnt(),"결석인원",cv.rose],[submissions.length,"총 제출수",cv.lav],[ROSTER.length-new Set(submissions.map(s=>s.stuId)).size,"미제출수",cv.peachDk]]
                    .map(([num,label,col])=>(
                      <div key={label} style={crd()}><div style={{fontWeight:900,fontSize:"1.9rem",color:col,lineHeight:1,marginBottom:".35rem"}}>{num}</div><div style={{fontSize:".8rem",color:cv.muted,fontWeight:700}}>{label}</div></div>
                    ))}
                </div>
                <div style={{display:"flex",gap:".55rem",marginBottom:"1rem",flexWrap:"wrap",alignItems:"center"}}>
                  {attSaved&&<span style={{fontSize:".77rem",color:cv.mint,fontWeight:700}}>✓ 저장됨</span>}
                  <button onClick={setAllPresent} style={{...btn(cv.mintLt,cv.mint),border:`1px solid ${cv.mintMd}`,fontSize:".78rem",padding:".35rem .85rem"}}>✓ 전원 출석</button>
                  <button onClick={()=>{setAtt({});setAttNote({});}} style={{...btn(cv.bg,cv.muted),border:`1px solid ${cv.border2}`,fontSize:".78rem",padding:".35rem .85rem"}}>초기화</button>
                  <button onClick={saveAtt} style={{...btn(`linear-gradient(135deg,${cv.lav},#9b59b6)`),fontSize:".78rem",padding:".35rem .85rem"}}>💾 저장</button>
                  <button onClick={exportExcel} style={{...btn("linear-gradient(135deg,#1e7e34,#27ae60)"),fontSize:".78rem",padding:".35rem .85rem"}}>📊 엑셀 내보내기</button>
                </div>
                <div style={{overflowX:"auto",borderRadius:12,border:`1.5px solid ${cv.border}`}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:".85rem",minWidth:680}}>
                    <thead>
                      <tr style={{background:"linear-gradient(90deg,#e8e0ff,#d4f5e8)"}}>
                        <th style={{padding:".55rem",textAlign:"center",borderBottom:`2px solid ${cv.border}`,fontSize:".84rem",fontWeight:700,color:cv.ink2,width:40}}>연번</th>
                        <th style={{padding:".55rem",textAlign:"center",borderBottom:`2px solid ${cv.border}`,fontSize:".84rem",fontWeight:700,color:cv.ink2,width:60}}>학번</th>
                        <th style={{padding:".55rem .55rem .55rem .9rem",textAlign:"left",borderBottom:`2px solid ${cv.border}`,fontSize:".84rem",fontWeight:700,color:cv.ink2,width:72}}>이름</th>
                        {PERIODS.map(p=>(<th key={p} style={{padding:".55rem .15rem",textAlign:"center",borderBottom:`2px solid ${cv.border}`,fontSize:".84rem",fontWeight:700,color:cv.ink2,width:44}}>{p}교시</th>))}
                        <th style={{padding:".55rem",textAlign:"left",borderBottom:`2px solid ${cv.border}`,fontSize:".84rem",fontWeight:700,color:cv.ink2}}>비고</th>
                      </tr>
                    </thead>
                    <tbody>
                      {ROSTER.map(s=>{
                        const hasAbs=PERIODS.some(p=>(att[s.id]||{})[p]==="/");
                        return(
                          <tr key={s.id} style={{background:hasAbs?"#fff7f8":"#fff"}}>
                            <td style={{padding:".42rem .45rem",textAlign:"center",borderBottom:`1px solid ${cv.border}`,color:cv.muted,fontSize:".8rem"}}>{s.no}</td>
                            <td style={{padding:".42rem .45rem",textAlign:"center",borderBottom:`1px solid ${cv.border}`,fontFamily:"monospace",fontWeight:700,fontSize:".83rem"}}>{s.id}</td>
                            <td style={{padding:".42rem .45rem .42rem .9rem",borderBottom:`1px solid ${cv.border}`,fontWeight:700,fontSize:".9rem"}}>{s.name}</td>
                            {PERIODS.map(p=>{const v=(att[s.id]||{})[p]||"";const isS=v==="/";return(<td key={p} style={{padding:".3rem .1rem",textAlign:"center",borderBottom:`1px solid ${cv.border}`}}><div onClick={()=>toggleAtt(s.id,p)} style={{width:36,height:28,margin:"0 auto",borderRadius:6,border:`1.5px solid ${isS?cv.rose:cv.border2}`,background:isS?cv.roseLt:"#fafcff",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:".95rem",fontWeight:800,color:isS?cv.rose:cv.border2,userSelect:"none"}}>{isS?"/":"·"}</div></td>);})}
                            <td style={{padding:".3rem .45rem",borderBottom:`1px solid ${cv.border}`}}><input value={attNote[s.id]||""} onChange={e=>setAttNote(p=>({...p,[s.id]:e.target.value}))} placeholder="—" style={{border:"none",outline:"none",background:"transparent",fontSize:".85rem",width:"100%",fontFamily:"inherit",color:cv.ink2}}/></td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                  <div style={{padding:".6rem 1rem",background:cv.bg,borderTop:`1px solid ${cv.border}`,fontSize:".75rem",color:cv.muted}}>클릭: 빈칸(출석) ↔ /(결석) &nbsp;|&nbsp; 결석 행 연분홍 표시</div>
                </div>
              </>
            )}

            {/* ══ 제출현황 (V3 활동별 세분화 유지) ══ */}
            {tab==="submissions"&&(
              <>
                <div style={{display:"flex",alignItems:"center",gap:".9rem",marginBottom:"1.4rem",flexWrap:"wrap"}}>
                  <div style={{fontWeight:800,fontSize:"1.3rem",color:cv.ink,whiteSpace:"nowrap"}}>📋 제출현황</div>
                  <div style={{display:"flex",alignItems:"center",gap:".5rem",flex:1,minWidth:280}}>
                    <span style={{fontSize:".8rem",color:cv.muted,whiteSpace:"nowrap"}}>📁 상위 폴더:</span>
                    <input style={{...inp(),flex:1,fontSize:".82rem",padding:".42rem .78rem"}} placeholder="https://drive.google.com/drive/folders/..." value={rootUrl} onChange={e=>{setRootUrl(e.target.value);ls.set("rootUrl",e.target.value);}}/>
                    <button onClick={autoMatch} style={{...btn(`linear-gradient(135deg,${cv.lav},#9b59b6)`),fontSize:".79rem",padding:".42rem .92rem",whiteSpace:"nowrap"}}>🔗 자동 매칭</button>
                  </div>
                </div>
                <div style={{display:"flex",gap:".45rem",flexWrap:"wrap",marginBottom:"1.1rem",alignItems:"center"}}>
                  <span style={pill("#f0f4ff",cv.ink2,cv.border2)}>전체 {ROSTER.length}명</span>
                  <span style={pill(cv.mintLt,cv.mint,cv.mintMd)}>✅ {ROSTER.filter(s=>getStatus(s)==="complete").length}명 완료</span>
                  <span style={pill(cv.lavLt,cv.lav,cv.lavMd)}>📝 {ROSTER.filter(s=>getStatus(s)==="ws").length}명 활동지만</span>
                  <span style={pill(cv.roseLt,cv.rose,cv.roseMd)}>❌ {ROSTER.filter(s=>getStatus(s)==="none").length}명 미제출</span>
                  <div style={{marginLeft:"auto",display:"flex",gap:".45rem"}}>
                    {driveSaved&&<span style={{fontSize:".77rem",color:cv.mint,fontWeight:700}}>✓ 저장됨</span>}
                    <button onClick={()=>{const n={};ROSTER.forEach(s=>n[s.id]=true);setDriveSub(n);}} style={{...btn("#e8f9f0","#1a7a46"),border:"1px solid #7ad9a0",fontSize:".78rem",padding:".35rem .82rem"}}>드라이브 전체 ✓</button>
                    <button onClick={()=>{ls.set("driveSub",driveSub);ls.set("driveUrls",driveUrls);setDriveSaved(true);setTimeout(()=>setDriveSaved(false),2200);}} style={{...btn(`linear-gradient(135deg,${cv.lav},#9b59b6)`),fontSize:".78rem",padding:".35rem .82rem"}}>💾 저장</button>
                  </div>
                </div>
                <div style={{overflowX:"auto",borderRadius:12,border:`1.5px solid ${cv.border}`}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:".83rem",minWidth:700}}>
                    <thead>
                      <tr style={{background:"linear-gradient(90deg,#e8e0ff,#d4f5e8)"}}>
                        {["연번","학번","이름"].map(h=><th key={h} style={{padding:".58rem .8rem",textAlign:h==="이름"?"left":"center",borderBottom:`2px solid ${cv.border}`,fontSize:".8rem",fontWeight:700,color:cv.ink2}}>{h}</th>)}
                        {questions.map((_,i)=><th key={i} style={{padding:".58rem .5rem",textAlign:"center",borderBottom:`2px solid ${cv.border}`,fontSize:".8rem",fontWeight:700,color:cv.ink2,width:80}}>활동{i+1}</th>)}
                        {["📁 드라이브","📂 폴더","종합","열람"].map(h=><th key={h} style={{padding:".58rem .8rem",textAlign:"center",borderBottom:`2px solid ${cv.border}`,fontSize:".8rem",fontWeight:700,color:cv.ink2,width:90}}>{h}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {ROSTER.map(s=>{
                        const st=getStatus(s);const[sbg,,sbc]=stC[st];const sub=submissions.find(x=>x.stuId===s.id);
                        return(
                          <tr key={s.id} style={{background:st==="complete"?"#f2fff8":st==="none"?"#fff8f8":"#fff"}}>
                            <td style={{padding:".45rem .8rem",textAlign:"center",borderBottom:`1px solid ${cv.border}`,color:cv.muted,fontSize:".78rem"}}>{s.no}</td>
                            <td style={{padding:".45rem .8rem",textAlign:"center",borderBottom:`1px solid ${cv.border}`,fontFamily:"monospace",fontWeight:700,fontSize:".8rem"}}>{s.id}</td>
                            <td style={{padding:".45rem .8rem",borderBottom:`1px solid ${cv.border}`,fontWeight:700}}>{s.name}</td>
                            {questions.map((q,qi)=>{
                              const isSubmitted=isActSubmitted(s.id,q.id);
                              return(<td key={qi} style={{padding:".45rem .5rem",textAlign:"center",borderBottom:`1px solid ${cv.border}`}}>
                                <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:".25rem"}}>
                                  <span style={isSubmitted?pill(cv.lavLt,cv.lav,cv.lavMd):pill(cv.bg,cv.muted,cv.border2)}>{isSubmitted?"✓ 제출":"미제출"}</span>
                                  {isSubmitted&&<button onClick={()=>resetAct(s.id,q.id)} style={{...btn(cv.roseLt,cv.rose),border:`1px solid ${cv.roseMd}`,fontSize:".68rem",padding:".13rem .48rem",borderRadius:6}}>↺ 리셋</button>}
                                </div>
                              </td>);
                            })}
                            <td style={{padding:".45rem .5rem",textAlign:"center",borderBottom:`1px solid ${cv.border}`}}><div onClick={()=>setDriveSub(p=>({...p,[s.id]:!p[s.id]}))} style={{...pill(driveSub[s.id]?"#e0f9ec":cv.bg,driveSub[s.id]?"#1a7a46":cv.muted,driveSub[s.id]?"#7ad9a0":cv.border2),cursor:"pointer",justifyContent:"center",minWidth:70}}>{driveSub[s.id]?"✓ 제출":"✕ 미제출"}</div></td>
                            <td style={{padding:".45rem .5rem",textAlign:"center",borderBottom:`1px solid ${cv.border}`}}>{driveUrls[s.id]?<a href={driveUrls[s.id]} target="_blank" rel="noreferrer" style={{...pill("#e8f9f0","#1a7a46","#7ad9a0"),textDecoration:"none"}}>📂 {s.name}</a>:<button onClick={()=>{const u=prompt(`${s.name} 폴더 URL:`);if(u){const n={...driveUrls,[s.id]:u.trim()};setDriveUrls(n);ls.set("driveUrls",n);}}} style={{...btn(cv.lavLt,cv.lav),border:`1px dashed ${cv.lavMd}`,fontSize:".75rem",padding:".22rem .58rem"}}>+ URL</button>}</td>
                            <td style={{padding:".45rem .5rem",textAlign:"center",borderBottom:`1px solid ${cv.border}`}}><span style={pill(sbg,stC[st][1],sbc)}>{stLabel[st]}</span></td>
                            <td style={{padding:".45rem .5rem",textAlign:"center",borderBottom:`1px solid ${cv.border}`}}>{sub?<button onClick={()=>{setSubmitted(sub);setPage("review");}} style={{...btn(cv.lavLt,cv.lav),border:`1px solid ${cv.lavMd}`,fontSize:".77rem",padding:".25rem .58rem"}}>교세특 →</button>:<span style={{color:cv.muted,fontSize:".77rem"}}>—</span>}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                <div style={{marginTop:".8rem",fontSize:".76rem",color:cv.muted}}>💡 활동별 ↺ 리셋 클릭 시 해당 답변 초기화 → 학생 재작성 가능</div>
              </>
            )}

            {/* ══ 문항설정 (V3 다중 이미지 유지) ══ */}
            {tab==="questions"&&(
              <>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.4rem"}}>
                  <div style={{fontWeight:800,fontSize:"1.3rem",color:cv.ink}}>✏️ 문항설정</div>
                  <div style={{display:"flex",gap:".65rem",alignItems:"center"}}>
                    {savedQ&&<span style={{fontSize:".8rem",color:cv.mint,fontWeight:700}}>✓ 저장됨</span>}
                    <button onClick={()=>{ls.set("qs",questions);setSavedQ(true);setTimeout(()=>setSavedQ(false),2000);}} style={btn(`linear-gradient(135deg,${cv.lav},#9b59b6)`)}>💾 전체 저장</button>
                  </div>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:"1rem"}}>
                  {questions.map((q,idx)=>(
                    <div key={q.id} style={crd()}>
                      <div onClick={()=>setExpandedQ(expandedQ===idx?null:idx)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",padding:".3rem 0"}}>
                        <div style={{display:"flex",alignItems:"center",gap:".7rem"}}><span style={{fontWeight:900,fontSize:"1.15rem",color:cv.lav}}>Q{idx+1}</span><span style={{fontWeight:700,color:cv.ink}}>{q.title}</span></div>
                        <div style={{display:"flex",gap:".5rem"}}>
                          <button onClick={e=>{e.stopPropagation();if(window.confirm("삭제?"))setQuestions(p=>p.filter((_,i)=>i!==idx));}} style={{...btn(cv.roseLt,cv.rose),border:`1px solid ${cv.roseMd}`,fontSize:".76rem",padding:".22rem .58rem"}}>삭제</button>
                          <span style={{color:cv.ink2}}>{expandedQ===idx?"▲":"▼"}</span>
                        </div>
                      </div>
                      {expandedQ===idx&&(
                        <div style={{borderTop:`1px solid ${cv.border}`,paddingTop:"1.1rem",display:"flex",flexDirection:"column",gap:".95rem",marginTop:".6rem"}}>
                          <div><div style={{fontSize:".78rem",fontWeight:700,color:cv.ink2,marginBottom:".28rem"}}>① 교과목</div><input style={inp()} value={q.subject} onChange={e=>setQuestions(p=>{const n=[...p];n[idx]={...n[idx],subject:e.target.value};return n;})}/></div>
                          <div>
                            <div style={{fontSize:".78rem",fontWeight:700,color:cv.ink2,marginBottom:".4rem"}}>② 지문/시 이미지 등록 (다중, 최대 3개)</div>
                            <PoemImageManager images={q.poemImages||[]} onChange={imgs=>setQuestions(p=>{const n=[...p];n[idx]={...n[idx],poemImages:imgs};return n;})}/>
                          </div>
                          <div><div style={{fontSize:".78rem",fontWeight:700,color:cv.ink2,marginBottom:".28rem"}}>③ 문항 내용 (안내/지문)</div><textarea style={{...inp(),minHeight:85,resize:"vertical",lineHeight:1.75}} value={q.question} onChange={e=>setQuestions(p=>{const n=[...p];n[idx]={...n[idx],question:e.target.value};return n;})}/></div>
                          <div><div style={{fontSize:".78rem",fontWeight:700,color:cv.ink2,marginBottom:".28rem"}}>④ 추가 문항 (세부 질문)</div><textarea style={{...inp(),minHeight:72,resize:"vertical",lineHeight:1.75}} value={q.subQuestion||""} onChange={e=>setQuestions(p=>{const n=[...p];n[idx]={...n[idx],subQuestion:e.target.value};return n;})} placeholder="예) ① ... ② ..."/></div>
                          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:".8rem"}}>
                            <div><div style={{fontSize:".78rem",fontWeight:700,color:cv.ink2,marginBottom:".28rem"}}>문항 제목</div><input style={inp()} value={q.title} onChange={e=>setQuestions(p=>{const n=[...p];n[idx]={...n[idx],title:e.target.value};return n;})}/></div>
                            <div><div style={{fontSize:".78rem",fontWeight:700,color:cv.ink2,marginBottom:".28rem"}}>최대 글자수</div><input style={inp()} type="number" value={q.maxLen} onChange={e=>setQuestions(p=>{const n=[...p];n[idx]={...n[idx],maxLen:parseInt(e.target.value)||500};return n;})}/></div>
                          </div>
                          <div>
                            <div style={{fontSize:".78rem",fontWeight:700,color:cv.ink2,marginBottom:".42rem"}}>평가 기준</div>
                            <div style={{display:"flex",gap:".4rem",flexWrap:"wrap"}}>
                              {q.rubric.map((r,ri)=>(
                                <div key={ri} style={{display:"flex",alignItems:"center",gap:".25rem",background:"#fff",border:`1.5px solid ${cv.border2}`,borderRadius:8,padding:".22rem .52rem"}}>
                                  <input value={r} onChange={e=>{const n=[...questions];const rb=[...n[idx].rubric];rb[ri]=e.target.value;n[idx]={...n[idx],rubric:rb};setQuestions(n);}} style={{border:"none",outline:"none",width:88,fontSize:".8rem",fontFamily:"inherit"}}/>
                                  <button onClick={()=>{const n=[...questions];n[idx]={...n[idx],rubric:n[idx].rubric.filter((_,i)=>i!==ri)};setQuestions(n);}} style={{background:"none",border:"none",cursor:"pointer",color:cv.muted,fontSize:".85rem"}}>✕</button>
                                </div>
                              ))}
                              <button onClick={()=>{const n=[...questions];n[idx]={...n[idx],rubric:[...n[idx].rubric,"항목"]};setQuestions(n);}} style={{...btn(cv.mintLt,cv.mint),border:`1px dashed ${cv.mintMd}`,fontSize:".78rem",padding:".24rem .65rem"}}>+ 추가</button>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  ))}
