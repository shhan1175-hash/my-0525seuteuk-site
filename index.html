/* ── Auto-grow textarea ── */
function AG({value,onChange,placeholder,style={},minH=52}){
  const r=useRef(null);
  useEffect(()=>{if(r.current){r.current.style.height="auto";r.current.style.height=Math.max(r.current.scrollHeight,minH)+"px";}},[value]);
  return <textarea ref={r} className="ag" value={value} onChange={onChange} placeholder={placeholder} style={{minHeight:minH,...style}}/>;
}

/* window.storage 사용 가능 여부 감지 */
const HAS_WS=typeof window!=="undefined"&&typeof window.storage?.get==="function"&&typeof window.storage?.set==="function";

const DB={
  async get(key,fallback){
    if(HAS_WS){
      try{const r=await window.storage.get(key,true);return r?JSON.parse(r.value):fallback;}
      catch{/* fall through */}
    }
    /* localStorage 폴백 */
    try{const v=localStorage.getItem(key);return v!=null?JSON.parse(v):fallback;}
    catch{return fallback;}
  },
  async set(key,val){
    if(HAS_WS){
      try{await window.storage.set(key,JSON.stringify(val),true);return;}
      catch(e){console.error("storage.set(shared) failed:",e);}
    }
    /* localStorage 폴백 */
    try{localStorage.setItem(key,JSON.stringify(val));}
    catch(e){console.error("localStorage.set failed:",e);}
  },
};
/* 로컬 캐시 (폴백) */
const LC={
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
};

async function callAI(prompt,engine,keys){
  if(engine==="Claude"){const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":keys.claude,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1200,messages:[{role:"user",content:prompt}]})});const d=await r.json();if(d.error)throw new Error(d.error.message);return(d.content||[]).map(x=>x.text||"").join("");}
  if(engine==="Gemini"){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${keys.gemini}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:1200}})});const d=await r.json();if(d.error)throw new Error(d.error.message);return d.candidates?.[0]?.content?.parts?.[0]?.text||"";}
  if(engine==="ChatGPT"){const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${keys.openai}`},body:JSON.stringify({model:"gpt-4o",max_tokens:1200,messages:[{role:"user",content:prompt}]})});const d=await r.json();if(d.error)throw new Error(d.error.message);return d.choices?.[0]?.message?.content||"";}
  throw new Error("알 수 없는 AI 엔진");
}
async function runOCRApi(imgData,keys){
  const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${keys.openai}`},body:JSON.stringify({model:"gpt-4o",max_tokens:1000,messages:[{role:"user",content:[{type:"image_url",image_url:{url:imgData}},{type:"text",text:"이미지의 텍스트를 정확히 추출하세요. 수식, 손글씨 포함. 텍스트만 출력."}]}]})});
  const d=await r.json();if(d.error)throw new Error(d.error.message);return d.choices?.[0]?.message?.content||"";
}
function getEmbedUrl(url){
  if(!url)return null;
  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
  return m?`https://www.youtube.com/embed/${m[1]}`:url;
}

}
function PoemImageManager({images,onChange}){
  const ref=useRef();const [editIdx,setEditIdx]=useState(null);const [lbl,setLbl]=useState("");
  const add=e=>{const f=e.target.files[0];if(!f)return;if(images.length>=3){alert("최대 3개");return;}const r=new FileReader();r.onload=ev=>onChange([...images,{dataUrl:ev.target.result,label:`시/지문 ${images.length+1}`}]);r.readAsDataURL(f);e.target.value="";};
  const del=i=>{const n=[...images];n.splice(i,1);onChange(n);};

  /* ════ WORKSHEET ════ */

              <div style={{display:"flex",gap:".9rem",flexWrap:"wrap",marginBottom:".38rem"}}>
                <label style={{display:"flex",alignItems:"center",gap:".35rem",cursor:"pointer",fontSize:".84rem",fontWeight:600,color:cv.ink2}}><input type="checkbox" checked={showMath} onChange={e=>setShowMath(e.target.checked)} style={{accentColor:cv.lav,width:14,height:14}}/> 수학 개념</label>

            </div>
          </div>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:"1.1rem",borderTop:`1.5px solid ${cv.border}`}}>
            <button disabled={curQ===0} onClick={()=>{setCurQ(p=>p-1);setVideoOpen(false);}} style={{...btn("#fff",cv.ink2),border:`1.5px solid ${cv.border2}`,borderRadius:20,padding:".5rem 1.1rem",opacity:curQ===0?.35:1}}>← 이전</button>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:".3rem"}}>
              {(needsSave||subNeedsSave)&&<span style={{fontSize:".73rem",color:cv.peachDk,fontWeight:700}}>⚠️ 저장 후 이동 가능</span>}
              {!isLast
                ?<button onClick={()=>{setCurQ(p=>p+1);setVideoOpen(false);}} disabled={needsSave||subNeedsSave} style={{...btn("#fff",cv.ink2),border:`1.5px solid ${cv.border2}`,borderRadius:20,padding:".5rem 1.1rem",opacity:(needsSave||subNeedsSave)?.35:1}}>다음 →</button>
                :<button onClick={submitWS} disabled={needsSave||subNeedsSave} style={{...btn("linear-gradient(135deg,#c05c1a,#e67e22)"),borderRadius:20,padding:".52rem 1.5rem",fontSize:".92rem",opacity:(needsSave||subNeedsSave)?.35:1}}>활동지 제출하기 →</button>
              }
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* ════ REVIEW ════ */
  if(page==="review"&&submitted)return(
    <div style={{background:cv.bg,minHeight:"100vh"}}>
      {generating&&<Spinner prog={genProg}/>}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 1rem",height:52,background:"#fff",borderBottom:`2px solid ${cv.border}`,position:"sticky",top:0,zIndex:80}}>
        <span onClick={reset} style={{fontWeight:800,fontSize:".95rem",cursor:"pointer",color:cv.ink}}>화법과 작문 × 확률과 통계</span>
        <span style={{fontSize:".76rem",color:cv.muted}}>{submitted.stuName}</span>
      </div>
      <div style={{maxWidth:780,margin:"0 auto",padding:"1.4rem 1rem 4rem"}}>
        <div style={{textAlign:"center",marginBottom:"1.6rem"}}><h1 style={{fontWeight:800,fontSize:"1.45rem",color:cv.ink,marginBottom:".3rem"}}>활동지 제출 완료 🎉</h1><p style={{fontSize:".85rem",color:cv.muted}}>AI 교세특 생성을 진행하거나 처음으로 돌아갈 수 있습니다</p></div>
        <div style={{display:"flex",flexDirection:"column",gap:".85rem",marginBottom:"1.4rem"}}>
          {questions.map(q=>{const a=submitted.answers[q.id]||{};return(<div key={q.id} style={crd()}><div style={{background:`linear-gradient(90deg,${cv.lavMd},${cv.mintMd})`,padding:".58rem 1rem",margin:"-1.2rem -1.2rem .9rem",display:"flex",justifyContent:"space-between",borderRadius:"11px 11px 0 0"}}><strong style={{fontSize:".9rem",color:cv.ink}}>{q.title}</strong><span style={{fontSize:".74rem",color:cv.ink2}}>{q.subject}</span></div><div style={{fontSize:".88rem",lineHeight:1.85,whiteSpace:"pre-wrap",color:cv.ink2}}>{a.text||"(미작성)"}</div></div>);})}
        </div>
        <div style={{...crd(),marginBottom:"1.3rem"}}><div style={{fontWeight:700,fontSize:".92rem",color:cv.ink2,marginBottom:".6rem"}}>📝 교사 추가 관찰</div><textarea style={{...inp(),height:78,resize:"vertical",background:"#fafcff",lineHeight:1.75}} value={tNote} onChange={e=>setTNote(e.target.value)} placeholder="수업 중 관찰 사항..."/></div>
        <button onClick={generate} disabled={generating} style={{...btn(`linear-gradient(135deg,${cv.lav},${cv.mint})`),width:"100%",padding:".9rem",fontSize:".97rem",borderRadius:10,opacity:generating?.6:1}}>✦ AI 교세특 자동 생성하기 ✦</button>
      </div>
    </div>
  );

  /* ════ RESULT ════ */
  if(page==="result"&&seteuk&&submitted)return(
    <div style={{background:cv.bg,minHeight:"100vh"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 1rem",height:52,background:"#fff",borderBottom:`2px solid ${cv.border}`,position:"sticky",top:0,zIndex:80}}>
        <span onClick={reset} style={{fontWeight:800,fontSize:".95rem",cursor:"pointer",color:cv.ink}}>화법과 작문 × 확률과 통계</span>
      </div>
      <div style={{maxWidth:680,margin:"0 auto",padding:"2rem 1rem 4rem"}}>
        <div style={{textAlign:"center",marginBottom:"1.6rem"}}><h1 style={{fontWeight:800,fontSize:"1.45rem",color:cv.ink,marginBottom:".3rem"}}>교세특 생성 완료</h1><div style={{display:"flex",justifyContent:"center",gap:"1.2rem",fontSize:".82rem",color:cv.muted,flexWrap:"wrap"}}><span>학생: <strong style={{color:cv.ink2}}>{submitted.stuName}</strong></span><span>학번: <strong style={{color:cv.ink2}}>{submitted.stuId}</strong></span></div></div>
        <div style={{...crd({padding:"1.8rem 2rem"}),position:"relative",marginBottom:"1.3rem"}}>
          <div style={{position:"absolute",top:-11,left:"1.2rem",background:cv.lavMd,padding:".08rem .55rem",fontSize:".68rem",fontWeight:700,color:cv.ink,borderRadius:18}}>세부능력 및 특기사항</div>
          <p style={{fontSize:".92rem",lineHeight:2.05,color:cv.ink,whiteSpace:"pre-wrap",wordBreak:"keep-all"}}>{seteuk}</p>
          <div style={{textAlign:"right",marginTop:".8rem",paddingTop:".7rem",borderTop:`1px solid ${cv.border}`,fontSize:".76rem",color:cv.muted}}>{seteuk.length}자</div>
        </div>
        <div style={{display:"flex",gap:".7rem",flexWrap:"wrap"}}>
          <button onClick={()=>navigator.clipboard.writeText(seteuk).then(()=>alert("복사!")).catch(()=>{})} style={{...btn(`linear-gradient(135deg,${cv.mint},#27ae60)`),flex:1,padding:".75rem",minWidth:90}}>📋 복사</button>
          <button onClick={()=>{setSeteuk(null);setPage("review");}} style={{...btn("#fff",cv.ink),border:`1.5px solid ${cv.border2}`,flex:1,padding:".75rem",minWidth:90}}>↺ 재생성</button>
          <button onClick={reset} style={{...btn("#fff",cv.muted),border:`1px solid ${cv.border}`,flex:1,padding:".75rem",minWidth:90}}>처음으로</button>
        </div>
      </div>
    </div>
  );
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
