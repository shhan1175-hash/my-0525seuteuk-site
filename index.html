/* auto-grow textarea 컴포넌트 */
function AutoTextarea({value,onChange,placeholder,style={},className=""}){
  const ref=useRef(null);
  useEffect(()=>{
    if(ref.current){ref.current.style.height="auto";ref.current.style.height=ref.current.scrollHeight+"px";}
  },[value]);
  return<textarea ref={ref} className={"autogrow "+className} value={value} onChange={onChange} placeholder={placeholder} style={style}/>;
}

/* 기존 문항 마이그레이션: subQuestion 문자열 → subQuestions 배열 */
function migrateQ(q){
  if(Array.isArray(q.subQuestions))return q;
  const subs=q.subQuestion?q.subQuestion.split("\n").filter(Boolean):[];
  return{...q,subQuestions:subs};
}

async function callAI(prompt,engine,keys){
  if(engine==="Claude"){
    const key=keys.claude;if(!key)throw new Error("Claude API 키가 없습니다.");
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1200,messages:[{role:"user",content:prompt}]})});
    const d=await res.json();if(d.error)throw new Error(d.error.message);
    return(d.content||[]).map(x=>x.text||"").join("")||"생성 결과 없음";
  }
  if(engine==="Gemini"){
    const key=keys.gemini;if(!key)throw new Error("Gemini API 키가 없습니다.");
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:1200}})});
    const d=await res.json();if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
    return d.candidates?.[0]?.content?.parts?.[0]?.text||"생성 결과 없음";
  }
  if(engine==="ChatGPT"){
    const key=keys.openai;if(!key)throw new Error("OpenAI API 키가 없습니다.");
    const res=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},body:JSON.stringify({model:"gpt-4o",max_tokens:1200,messages:[{role:"user",content:prompt}]})});
    const d=await res.json();if(d.error)throw new Error(d.error.message);
    return d.choices?.[0]?.message?.content||"생성 결과 없음";
  }
  throw new Error("알 수 없는 AI 엔진");
}

async function runVisionOCR(imgData,keys){
  const key=keys.openai;if(!key)throw new Error("OCR은 OpenAI API 키가 필요합니다.");
  const res=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},
    body:JSON.stringify({model:"gpt-4o",max_tokens:1000,messages:[{role:"user",content:[{type:"image_url",image_url:{url:imgData}},{type:"text",text:"이 이미지에 있는 텍스트를 정확하게 추출해 주세요. 수식, 시, 지문, 손글씨가 있다면 그대로 옮겨주세요. 텍스트만 출력하고 다른 설명은 하지 마세요."}]}]})});
  const d=await res.json();if(d.error)throw new Error(d.error.message);
  return d.choices?.[0]?.message?.content||"";
}

                <div style={{marginTop:".5rem"}}>
                  <div style={{fontSize:".8rem",fontWeight:700,color:cv.ink2,marginBottom:".4rem"}}>현재 AI 엔진</div>
                  <div style={{display:"flex",gap:".6rem"}}>{AI_ENGINES.map(eng=>(<label key={eng} style={{display:"flex",alignItems:"center",gap:".38rem",cursor:"pointer",padding:".38rem .75rem",borderRadius:8,border:`1.5px solid ${aiEngine===eng?cv.lav:cv.border2}`,background:aiEngine===eng?cv.lavLt:"#fff",fontWeight:aiEngine===eng?700:400,fontSize:".84rem",color:aiEngine===eng?cv.lav:cv.ink2}}><input type="radio" name="aiEngineSettings" value={eng} checked={aiEngine===eng} onChange={()=>{setAiEngine(eng);ls.set("aiEngine",eng);}} style={{accentColor:cv.lav}}/>{eng}</label>))}</div>
                </div>
              </div>
              <div style={{...crd(),marginBottom:"1rem"}}>
                <div style={{fontWeight:700,marginBottom:"1rem",fontSize:".97rem"}}>🔒 비밀번호 변경</div>
                <div style={{display:"flex",gap:".75rem",alignItems:"flex-end"}}>
                  <div style={{flex:1}}><div style={{fontSize:".78rem",fontWeight:700,color:cv.ink2,marginBottom:".3rem"}}>새 비밀번호 (숫자)</div><input type="password" style={inp()} placeholder="숫자만" value={newPw} onChange={e=>setNewPw(e.target.value.replace(/\D/g,"").slice(0,8))}/></div>
                  <button onClick={()=>{if(newPw.length<2){alert("최소 2자리");return;}setTeacherPw(newPw);ls.set("pw",newPw);setNewPw("");alert("변경 완료");}} style={btn(`linear-gradient(135deg,${cv.lav},#9b59b6)`)}>변경</button>
                </div>
              </div>
              <div style={{display:"flex",gap:".9rem",flexWrap:"wrap"}}>
                <button onClick={()=>{if(window.confirm("제출 데이터를 전부 삭제?"))setSubmissions([]);}} style={{...btn(cv.roseLt,cv.rose),border:`1px solid ${cv.roseMd}`}}>제출 데이터 삭제</button>
                <button onClick={()=>{if(window.confirm("문항을 기본값으로 복원?"))setQuestions(DEF_Q.map(migrateQ));}} style={{...btn(cv.roseLt,cv.rose),border:`1px solid ${cv.roseMd}`}}>문항 기본값 복원</button>
              </div>
            </>
          )}
        </main>
      </div>
    );
  }

  /* ════ WORKSHEET ════ */
  if(page==="worksheet"){
    const q=questions[curQ];if(!q)return null;
    const ans=answers[q.id]||{text:"",imgData:null,imgText:"",poemSel:"",subImgs:{},subImgTexts:{}};
    const cnt=(ans.text||"").length;
    const updAns=(f,v)=>setAnswers(p=>({...p,[q.id]:{...(p[q.id]||{}),[f]:v}}));
    const hasPoemImages=(q.poemImages||[]).length>0;
    const selPoem=(q.poemImages||[]).find(p=>p.label===ans.poemSel);
    const qid=q.id;
    const mainOcrKey=qid;
    const needsSave=ocrDone[mainOcrKey]&&!ocrSaved[mainOcrKey];
    const subNeedsSave=(q.subQuestions||[]).some((_,si)=>{const k=`${qid}_sub${si}`;return ocrDone[k]&&!ocrSaved[k];});
    const isLast=curQ===questions.length-1;
    return(
      <div style={{background:cv.bg,minHeight:"100vh"}}>
        {generating&&<Spinner prog={genProg}/>}
        <NavBar name={stuName} sub={`학번 ${stuId}`}/>
        <div style={{maxWidth:820,margin:"0 auto",padding:"1.8rem 1.2rem 4rem"}}>
          <div style={{textAlign:"center",padding:"1.8rem 1rem 1.6rem",marginBottom:"1.6rem",borderBottom:`2px solid ${cv.border}`}}>
            <div style={{fontSize:".74rem",letterSpacing:".22em",color:cv.muted,marginBottom:".35rem"}}>고등학교 교과 융합 활동지</div>
            <h1 style={{fontWeight:900,fontSize:"1.65rem",color:cv.ink,marginBottom:".45rem"}}>화법과 작문 × 확률과 통계</h1>
            <div style={{display:"inline-flex",gap:"1.5rem",border:`1.5px solid ${cv.border}`,padding:".5rem 1.4rem",borderRadius:22,fontSize:".88rem",background:"#fff"}}>
              <span><span style={{color:cv.muted,fontSize:".78rem"}}>이름 </span>{stuName}</span>
              <span><span style={{color:cv.muted,fontSize:".78rem"}}>학번 </span>{stuId}</span>
            </div>
          </div>
          <div style={{marginBottom:"1.5rem"}}>
            <div style={{textAlign:"center",fontSize:".84rem",color:cv.muted,background:"#fff",border:`1.5px solid ${cv.border}`,borderRadius:22,padding:".5rem 1.1rem",marginBottom:".55rem"}}>
              <strong style={{color:cv.ink}}>{doneCount}/{questions.length}</strong>개 활동 완료{doneCount===questions.length&&<span style={{color:cv.mint,fontWeight:700}}> ✓</span>}
            </div>
            <div style={{height:7,background:cv.border,borderRadius:999,overflow:"hidden"}}><div style={{height:"100%",width:((doneCount/Math.max(questions.length,1))*100)+"%",background:`linear-gradient(90deg,${cv.lavMd},${cv.mintMd})`,transition:"width .4s"}}/></div>
          </div>
          <div style={{display:"flex",gap:".45rem",flexWrap:"wrap",marginBottom:"1.3rem"}}>
            {questions.map((qq,i)=>{const done=(answers[qq.id]?.text||"").trim().length>=20,active=curQ===i;return<button key={qq.id} onClick={()=>setCurQ(i)} style={{padding:".38rem .88rem",fontSize:".79rem",border:`1.5px solid ${active?cv.lav:done?cv.mint:cv.border2}`,background:active?cv.lav:done?cv.mintLt:"#fff",color:active?"#fff":done?cv.mint:cv.muted,borderRadius:22,cursor:"pointer",fontWeight:700}}>{i+1}. {qq.title}{done?" ✓":""}</button>;})}
          </div>

          <div style={{...crd(),marginBottom:"1.1rem",animation:"fadeUp .25s ease"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:".6rem"}}>
              <span style={{fontWeight:900,fontSize:"2rem",color:cv.border2,lineHeight:1}}>0{curQ+1}</span>
              <span style={pill(cv.lavLt,cv.lav,cv.lavMd)}>{q.subject}</span>
            </div>
            <div style={{fontWeight:800,fontSize:"1.08rem",color:cv.ink,marginBottom:".55rem"}}>{q.title}</div>
            {q.rubric.length>0&&<div style={{display:"flex",gap:".35rem",flexWrap:"wrap",marginBottom:".9rem"}}>{q.rubric.map(r=><span key={r} style={pill(cv.peachLt,cv.peachDk,cv.peachMd)}>◆ {r}</span>)}</div>}

            {/* 지문/시 이미지 — 항상 표시 */}
            {hasPoemImages&&(
              <div style={{background:cv.skyLt,border:`1.5px solid ${cv.skyMd}`,borderRadius:10,padding:".85rem 1rem",marginBottom:"1rem"}}>
                <div style={{fontWeight:800,fontSize:".88rem",color:"#1a5f8a",marginBottom:".6rem"}}>📜 지문 / 시</div>
                {(q.poemImages||[]).length===1
                  ?<div>
                      <img src={q.poemImages[0].dataUrl} alt={q.poemImages[0].label} style={{maxWidth:"100%",borderRadius:9,border:`1.5px solid ${cv.border}`,display:"block",maxHeight:480,objectFit:"contain",background:"#f8f9fc"}}/>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:".55rem"}}>
                        <span style={{fontSize:".8rem",color:cv.muted,fontWeight:600}}>{q.poemImages[0].label}</span>
                        <button onClick={()=>runOCR(curQ,q.poemImages[0].dataUrl)} disabled={!!ocrLoading[mainOcrKey]} style={{...btn(`linear-gradient(135deg,${cv.lav},#9b59b6)`),fontSize:".78rem",padding:".35rem .85rem",opacity:ocrLoading[mainOcrKey]?.6:1}}>{ocrLoading[mainOcrKey]?"⏳ 읽는 중...":"🔍 AI 이미지 읽기"}</button>
                      </div>
                    </div>
                  :<div>
                      <select style={inp()} value={ans.poemSel||""} onChange={e=>updAns("poemSel",e.target.value)}>
                        <option value="">-- 지문 / 시를 선택하세요 --</option>
                        {(q.poemImages||[]).map((pi,i)=><option key={i} value={pi.label}>{pi.label}</option>)}
                      </select>
                      {selPoem&&(<div style={{marginTop:".75rem"}}>
                        <img src={selPoem.dataUrl} alt={selPoem.label} style={{maxWidth:"100%",borderRadius:9,border:`1.5px solid ${cv.border}`,display:"block",maxHeight:480,objectFit:"contain",background:"#f8f9fc"}}/>
                        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:".55rem"}}>
                          <span style={{fontSize:".8rem",color:cv.muted,fontWeight:600}}>{selPoem.label}</span>
                          <button onClick={()=>runOCR(curQ,selPoem.dataUrl)} disabled={!!ocrLoading[mainOcrKey]} style={{...btn(`linear-gradient(135deg,${cv.lav},#9b59b6)`),fontSize:".78rem",padding:".35rem .85rem",opacity:ocrLoading[mainOcrKey]?.6:1}}>{ocrLoading[mainOcrKey]?"⏳ 읽는 중...":"🔍 AI 이미지 읽기"}</button>
                        </div>
                      </div>)}
                    </div>
                }
              </div>
            )}

            {/* 탐구 안내 — 문항 내용 + 추가문항 */}
            <div style={{background:"#fffbf0",borderLeft:`3px solid ${cv.peachMd}`,padding:".9rem 1.1rem",borderRadius:"0 9px 9px 0",marginBottom:"1rem"}}>
              <div style={{fontWeight:800,fontSize:".84rem",color:cv.peachDk,marginBottom:".5rem"}}>📌 탐구 안내</div>
              <div style={{fontWeight:700,fontSize:".92rem",lineHeight:1.9,color:cv.ink2,whiteSpace:"pre-line"}}>{q.question}</div>
              {(q.subQuestions||[]).length>0&&(
                <div style={{marginTop:".6rem",paddingTop:".6rem",borderTop:`1px dashed ${cv.peachMd}`}}>
                  {(q.subQuestions||[]).map((sq,si)=>sq&&(
                    <div key={si} style={{fontWeight:700,fontSize:".9rem",lineHeight:1.9,color:cv.ink2,display:"flex",gap:".4rem"}}>
                      <span style={{color:cv.peachDk,flexShrink:0}}>{si+1})</span><span>{sq}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* 2.4 추가문항별 개별 이미지 업로드 + OCR */}
            {(q.subQuestions||[]).some(sq=>sq)&&(
              <div style={{display:"flex",flexDirection:"column",gap:".75rem",marginBottom:"1rem"}}>
                {(q.subQuestions||[]).map((sq,si)=>{
                  if(!sq)return null;
                  const subKey=`${qid}_sub${si}`;
                  const subImg=(ans.subImgs||{})[si]||null;
                  const subTxt=(ans.subImgTexts||{})[si]||"";
                  const subOcrNeedsSave=ocrDone[subKey]&&!ocrSaved[subKey];
                  return(
                    <div key={si} style={{background:cv.lavLt,border:`1.5px solid ${cv.lavMd}`,borderRadius:10,padding:".85rem 1rem"}}>
                      <div style={{fontWeight:800,fontSize:".84rem",color:cv.lav,marginBottom:".55rem"}}>📝 문항 {si+1}) 수기 답변 사진</div>
                      <StuImgUpload value={subImg} onChange={v=>{const si2=si;setAnswers(p=>({...p,[qid]:{...(p[qid]||{}),subImgs:{...((p[qid]||{}).subImgs||{}),[si2]:v}}}));if(!v){setOcrDone(pr=>({...pr,[subKey]:false}));setOcrSaved(pr=>({...pr,[subKey]:false}));}}}/>
                      {subImg&&(
                        <div style={{marginTop:".65rem"}}>
                          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:".3rem"}}>
                            <span style={{fontSize:".79rem",fontWeight:700,color:cv.ink2}}>OCR 결과 텍스트</span>
                            <button onClick={()=>runOCR(curQ,subImg,si)} disabled={!!ocrLoading[subKey]} style={{...btn(`linear-gradient(135deg,${cv.lav},#9b59b6)`),fontSize:".76rem",padding:".3rem .8rem",opacity:ocrLoading[subKey]?.6:1}}>{ocrLoading[subKey]?"⏳ 읽는 중...":"🔍 AI 이미지 읽기"}</button>
                          </div>
                          <textarea style={{...inp(),minHeight:80,resize:"vertical",lineHeight:1.8,background:"#fafcff"}} value={subTxt} onChange={e=>setAnswers(p=>({...p,[qid]:{...(p[qid]||{}),subImgTexts:{...((p[qid]||{}).subImgTexts||{}),[si]:e.target.value}}}))} placeholder="OCR 결과 또는 직접 입력..."/>
                          {ocrDone[subKey]&&(
                            <div style={{marginTop:".5rem",padding:".65rem .9rem",background:ocrSaved[subKey]?cv.mintLt:cv.peachLt,border:`1.5px solid ${ocrSaved[subKey]?cv.mintMd:cv.peachMd}`,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"space-between",gap:".8rem"}}>
                              <span style={{fontSize:".82rem",fontWeight:700,color:ocrSaved[subKey]?cv.mint:cv.peachDk}}>{ocrSaved[subKey]?"✅ 저장 완료":"⚠️ 확인 후 저장해주세요"}</span>
                              {!ocrSaved[subKey]&&<button onClick={()=>setOcrSaved(p=>({...p,[subKey]:true}))} style={{...btn(`linear-gradient(135deg,${cv.mint},#27ae60)`),padding:".4rem .9rem",fontSize:".82rem",flexShrink:0}}>💾 저장하기</button>}
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}

            {/* 메인 답변 */}
            <div style={{fontSize:".79rem",fontWeight:700,color:cv.ink2,marginBottom:".35rem"}}>✏️ 활동 답변 작성</div>
            <textarea style={{...inp(),minHeight:140,resize:"vertical",lineHeight:1.9,background:"#fafcff"}} placeholder={q.placeholder||"답변을 입력하세요..."} value={ans.text} maxLength={q.maxLen} onChange={e=>updAns("text",e.target.value)}/>
            <div style={{textAlign:"right",fontSize:".76rem",color:cnt>q.maxLen*.9?cv.rose:cv.muted,marginTop:".25rem",fontWeight:cnt>q.maxLen*.9?700:400}}>{cnt} / {q.maxLen}자</div>

            {/* 활동지 전체 사진 업로드 */}
            <div style={{marginTop:"1.1rem"}}>
              <div style={{fontSize:".79rem",fontWeight:700,color:cv.ink2,marginBottom:".35rem"}}>📸 활동지 전체 사진 <span style={{color:cv.muted,fontWeight:400}}>(선택)</span></div>
              <StuImgUpload value={ans.imgData} onChange={v=>{updAns("imgData",v);if(!v){setOcrDone(p=>({...p,[mainOcrKey]:false}));setOcrSaved(p=>({...p,[mainOcrKey]:false}));}}}/>
            </div>
            {ans.imgData&&(
              <div style={{marginTop:"1rem"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:".35rem"}}>
                  <div style={{fontSize:".79rem",fontWeight:700,color:cv.ink2}}>📝 이미지 텍스트 변환</div>
                  <button onClick={()=>runOCR(curQ,ans.imgData)} disabled={!!ocrLoading[mainOcrKey]} style={{...btn(`linear-gradient(135deg,${cv.lav},#9b59b6)`),fontSize:".76rem",padding:".3rem .8rem",opacity:ocrLoading[mainOcrKey]?.6:1}}>{ocrLoading[mainOcrKey]?"⏳":"🔍 AI 이미지 읽기"}</button>
                </div>
                <textarea style={{...inp(),minHeight:95,resize:"vertical",lineHeight:1.8,background:"#fafcff"}} value={ans.imgText} onChange={e=>updAns("imgText",e.target.value)} placeholder="이미지 내용을 텍스트로..."/>
                {ocrDone[mainOcrKey]&&(
                  <div style={{marginTop:".65rem",padding:".75rem 1rem",background:ocrSaved[mainOcrKey]?cv.mintLt:cv.peachLt,border:`1.5px solid ${ocrSaved[mainOcrKey]?cv.mintMd:cv.peachMd}`,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"space-between",gap:"1rem"}}>
                    <span style={{fontSize:".84rem",fontWeight:700,color:ocrSaved[mainOcrKey]?cv.mint:cv.peachDk}}>{ocrSaved[mainOcrKey]?"✅ 저장 완료":"⚠️ 확인 후 저장해주세요"}</span>
                    {!ocrSaved[mainOcrKey]&&<button onClick={()=>setOcrSaved(p=>({...p,[mainOcrKey]:true}))} style={{...btn(`linear-gradient(135deg,${cv.mint},#27ae60)`),padding:".5rem 1.1rem",fontSize:".86rem",flexShrink:0}}>💾 저장하기</button>}
                  </div>
                )}
              </div>
            )}

            {/* 선택적 분석 메모 */}
            <div style={{background:cv.skyLt,border:`1.5px solid ${cv.skyMd}`,borderRadius:10,padding:".75rem 1rem",marginTop:"1rem"}}>
              <div style={{fontWeight:800,fontSize:".84rem",color:"#1a5f8a",marginBottom:".45rem"}}>📋 분석 메모 <span style={{fontSize:".75rem",fontWeight:400,color:cv.muted}}>(선택)</span></div>
              <div style={{display:"flex",gap:"1rem",flexWrap:"wrap",marginBottom:".4rem"}}>
                <label style={{display:"flex",alignItems:"center",gap:".38rem",cursor:"pointer",fontSize:".86rem",fontWeight:600,color:cv.ink2}}><input type="checkbox" checked={showMath} onChange={e=>setShowMath(e.target.checked)} style={{accentColor:cv.lav,width:15,height:15}}/> 수학 개념</label>
                <label style={{display:"flex",alignItems:"center",gap:".38rem",cursor:"pointer",fontSize:".86rem",fontWeight:600,color:cv.ink2}}><input type="checkbox" checked={showNonFic} onChange={e=>setShowNonFic(e.target.checked)} style={{accentColor:cv.lav,width:15,height:15}}/> 비문학 지문</label>
              </div>
              {showMath&&(<div style={{marginTop:".5rem"}}><div style={{fontWeight:700,fontSize:".81rem",color:"#1a5f8a",marginBottom:".25rem"}}>수학 개념 메모</div><input style={{...inp(),fontSize:".88rem",background:"#fff"}} placeholder="예) 조건부 확률, 베이즈 정리..." value={ans.mathConcept||""} onChange={e=>updAns("mathConcept",e.target.value)}/></div>)}
              {showNonFic&&(<div style={{marginTop:".5rem"}}><div style={{fontWeight:700,fontSize:".81rem",color:"#1a5f8a",marginBottom:".25rem"}}>비문학 지문 메모</div><textarea style={{...inp(),minHeight:70,resize:"vertical",lineHeight:1.75,background:"#fff",fontSize:".88rem"}} value={ans.nonFic||""} onChange={e=>updAns("nonFic",e.target.value)} placeholder="비문학 지문 핵심 내용..."/></div>)}
            </div>
          </div>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:"1.3rem",borderTop:`1.5px solid ${cv.border}`}}>
            <button disabled={curQ===0} onClick={()=>setCurQ(p=>p-1)} style={{...btn("#fff",cv.ink2),border:`1.5px solid ${cv.border2}`,borderRadius:22,padding:".54rem 1.2rem",opacity:curQ===0?.35:1}}>← 이전</button>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:".35rem"}}>
              {(needsSave||subNeedsSave)&&<span style={{fontSize:".75rem",color:cv.peachDk,fontWeight:700}}>⚠️ 저장 후 이동 가능합니다</span>}
              {!isLast
                ?<button onClick={()=>setCurQ(p=>p+1)} disabled={needsSave||subNeedsSave} style={{...btn("#fff",cv.ink2),border:`1.5px solid ${cv.border2}`,borderRadius:22,padding:".54rem 1.2rem",opacity:(needsSave||subNeedsSave)?.35:1}}>다음 →</button>
                :<button onClick={submitWS} disabled={needsSave||subNeedsSave} style={{...btn("linear-gradient(135deg,#c05c1a,#e67e22)"),borderRadius:22,padding:".56rem 1.6rem",fontSize:".95rem",opacity:(needsSave||subNeedsSave)?.35:1}}>활동지 제출하기 →</button>
              }
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* ════ REVIEW ════ */
  if(page==="review"&&submitted)return(
    <div style={{background:cv.bg,minHeight:"100vh"}}>
      {generating&&<Spinner prog={genProg}/>}
      <NavBar name={submitted.stuName} sub={submitted.at}/>
      <div style={{maxWidth:820,margin:"0 auto",padding:"1.8rem 1.2rem 4rem"}}>
        <div style={{textAlign:"center",marginBottom:"1.9rem"}}><h1 style={{fontWeight:800,fontSize:"1.55rem",color:cv.ink,marginBottom:".35rem"}}>활동지 제출 완료 🎉</h1></div>
        <div style={{display:"flex",flexDirection:"column",gap:".9rem",marginBottom:"1.6rem"}}>
          {questions.map(q=>{const ans=submitted.answers[q.id]||{};return(<div key={q.id} style={crd()}>
            <div style={{background:`linear-gradient(90deg,${cv.lavMd},${cv.mintMd})`,padding:".62rem 1.1rem",margin:"-1.3rem -1.3rem 1rem",display:"flex",justifyContent:"space-between",borderRadius:"11px 11px 0 0"}}>
              <strong style={{fontSize:".95rem",color:cv.ink}}>{q.title}</strong><span style={{fontSize:".76rem",color:cv.ink2}}>{q.subject}</span>
            </div>
            <div style={{fontSize:".9rem",lineHeight:1.9,whiteSpace:"pre-wrap",color:cv.ink2,marginBottom:ans.imgData?".9rem":0}}>{ans.text||"(미작성)"}</div>
            {ans.imgData&&<div style={{borderRadius:9,overflow:"hidden",border:`1px solid ${cv.border}`}}><img src={ans.imgData} alt="" style={{width:"100%",maxHeight:210,objectFit:"contain",background:"#f8f9fc",display:"block"}}/></div>}
          </div>);})}
        </div>
        <div style={{...crd(),marginBottom:"1.4rem"}}>
          <div style={{fontWeight:700,fontSize:".95rem",color:cv.ink2,marginBottom:".65rem"}}>📝 교사 추가 관찰 사항 <span style={{fontWeight:400,fontSize:".82rem",color:cv.muted}}>(선택)</span></div>
          <textarea style={{...inp(),height:82,resize:"vertical",background:"#fafcff",lineHeight:1.75}} value={tNote} onChange={e=>setTNote(e.target.value)}/>
        </div>
        <button onClick={generate} disabled={generating} style={{...btn(`linear-gradient(135deg,${cv.lav},${cv.mint})`),width:"100%",padding:".95rem",fontSize:"1rem",borderRadius:11,opacity:generating?.6:1}}>✦ AI 교세특 자동 생성하기 ✦</button>
      </div>
    </div>
  );

  /* ════ RESULT ════ */
  if(page==="result"&&seteuk&&submitted)return(
    <div style={{background:cv.bg,minHeight:"100vh"}}>
      <NavBar/>
      <div style={{maxWidth:720,margin:"0 auto",padding:"2.2rem 1.2rem 4rem"}}>
        <div style={{textAlign:"center",marginBottom:"1.9rem"}}>
          <h1 style={{fontWeight:800,fontSize:"1.55rem",color:cv.ink,marginBottom:".35rem"}}>교세특 생성 완료</h1>
          <div style={{display:"flex",justifyContent:"center",gap:"1.3rem",fontSize:".84rem",color:cv.muted,flexWrap:"wrap"}}>
            <span>학생: <strong style={{color:cv.ink2}}>{submitted.stuName}</strong></span>
            <span>학번: <strong style={{color:cv.ink2}}>{submitted.stuId}</strong></span>
          </div>
        </div>
        <div style={{...crd({padding:"2rem 2.2rem"}),position:"relative",marginBottom:"1.5rem"}}>
          <div style={{position:"absolute",top:-12,left:"1.3rem",background:cv.lavMd,padding:".1rem .58rem",fontSize:".7rem",fontWeight:700,color:cv.ink,letterSpacing:".1em",borderRadius:20}}>세부능력 및 특기사항</div>
          <p style={{fontSize:".95rem",lineHeight:2.1,color:cv.ink,whiteSpace:"pre-wrap",wordBreak:"keep-all"}}>{seteuk}</p>
          <div style={{textAlign:"right",marginTop:".9rem",paddingTop:".75rem",borderTop:`1px solid ${cv.border}`,fontSize:".78rem",color:cv.muted}}>{seteuk.length}자</div>
        </div>
        <div style={{display:"flex",gap:".8rem",flexWrap:"wrap"}}>
          <button onClick={()=>navigator.clipboard.writeText(seteuk).then(()=>alert("복사!")).catch(()=>{})} style={{...btn(`linear-gradient(135deg,${cv.mint},#27ae60)`),flex:1,padding:".78rem",minWidth:100}}>📋 복사</button>
          <button onClick={()=>{setSeteuk(null);setPage("review");}} style={{...btn("#fff",cv.ink),border:`1.5px solid ${cv.border2}`,flex:1,padding:".78rem",minWidth:100}}>↺ 다시 생성</button>
          <button onClick={reset} style={{...btn("#fff",cv.muted),border:`1px solid ${cv.border}`,flex:1,padding:".78rem",minWidth:100}}>처음으로</button>
        </div>
      </div>
    </div>
  );
  return null;
}

/* 서브 컴포넌트 */
function PoemImageManager({images,onChange}){
  const ref=useRef();
  const [editIdx,setEditIdx]=useState(null);
  const [labelInput,setLabelInput]=useState("");
  const cv2={lav:"#7c5cbf",lavLt:"#ede9ff",lavMd:"#c5b8f5",rose:"#b03060",roseLt:"#fff0f4",roseMd:"#f5b8c8",bg:"#f0f4ff",border:"#e2dcf5",border2:"#cec8ea",ink2:"#4a4560",muted:"#8882a8"};
  const b=(bg,col="#fff",ex={})=>({background:bg,color:col,border:"none",borderRadius:8,padding:".55rem 1.1rem",fontWeight:700,cursor:"pointer",fontSize:".85rem",fontFamily:"inherit",...ex});
  const i2=(ex={})=>({width:"100%",border:`1.5px solid ${cv2.border2}`,borderRadius:8,padding:".65rem .9rem",fontSize:".92rem",outline:"none",fontFamily:"inherit",background:"#fff",...ex});
  const addImage=e=>{const f=e.target.files[0];if(!f)return;if(images.length>=3){alert("최대 3개");return;}const r=new FileReader();r.onload=ev=>onChange([...images,{dataUrl:ev.target.result,label:`시/지문 ${images.length+1}`}]);r.readAsDataURL(f);e.target.value="";};
  const removeImage=i=>{const n=[...images];n.splice(i,1);onChange(n);};
  const saveLabel=i=>{const n=[...images];n[i]={...n[i],label:labelInput};onChange(n);setEditIdx(null);};
  return(
    <div>
      <div style={{display:"flex",flexDirection:"column",gap:".6rem",marginBottom:".6rem"}}>
        {images.map((img,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:".7rem",background:cv2.bg,borderRadius:8,padding:".6rem .85rem",border:`1px solid ${cv2.border}`}}>
          <img src={img.dataUrl} alt="" style={{width:52,height:40,objectFit:"cover",borderRadius:6,border:`1px solid ${cv2.border2}`,flexShrink:0}}/>
          {editIdx===i?<input autoFocus style={{...i2(),flex:1,fontSize:".84rem",padding:".35rem .65rem"}} value={labelInput} onChange={e=>setLabelInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")saveLabel(i);if(e.key==="Escape")setEditIdx(null);}}/>:<span style={{flex:1,fontSize:".85rem",fontWeight:600,color:cv2.ink2}}>{img.label}</span>}
          {editIdx===i?<button onClick={()=>saveLabel(i)} style={{...b(cv2.lav),fontSize:".75rem",padding:".3rem .7rem"}}>확인</button>:<button onClick={()=>{setEditIdx(i);setLabelInput(img.label);}} style={{...b(cv2.lavLt,cv2.lav),border:`1px solid ${cv2.lavMd}`,fontSize:".75rem",padding:".3rem .65rem"}}>이름 수정</button>}
          <button onClick={()=>removeImage(i)} style={{...b(cv2.roseLt,cv2.rose),border:`1px solid ${cv2.roseMd}`,fontSize:".75rem",padding:".3rem .65rem"}}>삭제</button>
        </div>))}
      </div>
      {images.length<3&&(<label style={{display:"flex",alignItems:"center",gap:".5rem",padding:".65rem 1rem",background:cv2.lavLt,border:`1.5px dashed ${cv2.lavMd}`,borderRadius:8,cursor:"pointer",fontSize:".84rem",color:cv2.lav,fontWeight:700}}><input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={addImage}/>📎 시/지문 이미지 추가 ({images.length}/3)</label>)}
      <div style={{fontSize:".73rem",color:cv2.muted,marginTop:".4rem"}}>등록된 이미지는 학생 활동지에 자동 표시됩니다.</div>
    </div>
  );
}
function StuImgUpload({value,onChange}){
  const ref=useRef();
  const hf=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>onChange(ev.target.result);r.readAsDataURL(f);e.target.value="";};
  return(<div>
    {value?<div style={{position:"relative",width:"100%",marginBottom:".4rem"}}><img src={value} alt="" style={{maxWidth:"100%",maxHeight:230,borderRadius:9,border:"1.5px solid #e2dcf5",display:"block"}}/><button onClick={()=>onChange(null)} style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,.55)",border:"none",borderRadius:"50%",width:26,height:26,color:"#fff",cursor:"pointer",fontSize:".9rem",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button></div>
    :<div onClick={()=>ref.current.click()} style={{border:"1.5px dashed #cec8ea",borderRadius:9,padding:"1.2rem",textAlign:"center",cursor:"pointer",background:"#fafcff",color:"#8882a8",fontSize:".86rem",lineHeight:1.7}}>📷 사진을 업로드하세요<br/><span style={{fontSize:".76rem"}}>jpg, png 등</span></div>}
    <input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={hf}/>
  </div>);
}
function CompCheck({label,items,sel,onChange}){
  const tog=item=>onChange(sel.includes(item)?sel.filter(x=>x!==item):[...sel,item]);
  return(<div style={{background:"#f8f9fc",borderRadius:9,padding:".72rem .88rem",border:"1px solid #e2dcf5"}}>
    <div style={{fontSize:".76rem",fontWeight:700,color:"#4a4560",marginBottom:".45rem"}}>{label}</div>
    {items.map(item=>(<label key={item} style={{display:"flex",alignItems:"center",gap:".38rem",cursor:"pointer",fontSize:".82rem",color:sel.includes(item)?"#7c5cbf":"#4a4560",fontWeight:sel.includes(item)?700:400,marginBottom:".3rem"}}><input type="checkbox" checked={sel.includes(item)} onChange={()=>tog(item)} style={{accentColor:"#7c5cbf"}}/>{item}</label>))}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
