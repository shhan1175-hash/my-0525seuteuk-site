          화법과 작문 × 확률과 통계<br/>
          1·2·3차 기획서 전체 반영 완성본
        </p>

        <div style={{background:"#f0f4ff",borderRadius:12,padding:"1.2rem 1.4rem",marginBottom:"2rem",textAlign:"left"}}>
          <div style={{fontSize:".82rem",fontWeight:700,color:"#4a4560",marginBottom:".7rem"}}>✅ 포함된 기능</div>
          {[
            "학번+성명 학생 로그인",
            "출석체크 (빈칸↔/ 토글) + 엑셀 내보내기",
            "제출현황 + 구글 드라이브 자동 매칭",
            "문항설정 (이미지·추가문항 포함)",
            "활동 분석 및 세특 작성 (AI 생성)",
            "문항↔세특 데이터 자동 연동 (3차)",
            "활동별 세특 우측 즉시 표시 (3차)",
            "모든 데이터 localStorage 자동 저장",
          ].map((f, i) => (
            <div key={i} style={{display:"flex",alignItems:"center",gap:".5rem",fontSize:".82rem",color:"#4a4560",marginBottom:".35rem"}}>
              <span style={{color:"#2d7a5e",fontWeight:700}}>•</span> {f}
            </div>
          ))}
        </div>

        <button
          onClick={handleDownload}
          style={{
            width:"100%",padding:"1rem",
            background: downloaded ? "linear-gradient(135deg,#2d7a5e,#27ae60)" : "linear-gradient(135deg,#7c5cbf,#9b59b6)",
            color:"#fff",border:"none",borderRadius:12,
            fontWeight:800,fontSize:"1.05rem",cursor:"pointer",
            boxShadow:"0 4px 18px rgba(124,92,191,.3)",
            transition:"all .2s",fontFamily:"inherit"
          }}
        >
          {downloaded ? "✅ 다운로드 완료!" : "⬇️ 교과융합수업.html 다운로드"}
        </button>

        <div style={{marginTop:"1.2rem",fontSize:".8rem",color:"#8882a8",lineHeight:1.7}}>
          다운로드 후 파일을 <strong style={{color:"#4a4560"}}>더블클릭</strong>하면<br/>
          브라우저에서 바로 실행됩니다
        </div>
      </div>
    </div>
  );
}
