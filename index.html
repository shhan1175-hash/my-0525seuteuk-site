<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>화법과 작문 × 확률과 통계 | 교과 융합수업</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f0f4ff;--surface:#fff;
  --lav:#7c5cbf;--lav-lt:#ede9ff;--lav-md:#c5b8f5;
  --mint:#2d7a5e;--mint-lt:#e6f9f2;--mint-md:#a8e6cf;
  --rose:#b03060;--rose-lt:#fff0f4;--rose-md:#f5b8c8;
  --peach-dk:#c05c1a;--peach-lt:#fff4ec;--peach-md:#ffcba4;
  --sky-lt:#e8f4fd;--sky-md:#b3d9f7;
  --ink:#2d2840;--ink2:#4a4560;--muted:#8882a8;
  --border:#e2dcf5;--border2:#cec8ea;
}
html{scroll-behavior:smooth;}
body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;font-size:15px;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
input,select,textarea,button{font-family:'Pretendard',sans-serif;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

/* ───────── 상수 ───────── */
const ROSTER=[
  {no:1,id:"3105",name:"김성현"},{no:2,id:"3112",name:"박성욱"},{no:3,id:"3306",name:"김민재"},
  {no:4,id:"3332",name:"홍민우"},{no:5,id:"3401",name:"권혁준"},{no:6,id:"3402",name:"김민우"},
  {no:7,id:"3406",name:"김종서"},{no:8,id:"3415",name:"오호준"},{no:9,id:"3421",name:"유지원"},
  {no:10,id:"3426",name:"임영재"},{no:11,id:"3433",name:"허재호"},{no:12,id:"3502",name:"권우민"},
  {no:13,id:"3506",name:"김시우"},{no:14,id:"3507",name:"김시헌"},{no:15,id:"3508",name:"김시혁"},
  {no:16,id:"3509",name:"김영인"},{no:17,id:"3511",name:"김준서"},{no:18,id:"3512",name:"김태수"},
  {no:19,id:"3513",name:"김학성"},{no:20,id:"3515",name:"박종찬"},{no:21,id:"3516",name:"손상혁"},
  {no:22,id:"3517",name:"신승빈"},{no:23,id:"3518",name:"신승하"},{no:24,id:"3529",name:"전재현"},
  {no:25,id:"3532",name:"진현준"},{no:26,id:"3534",name:"황우태"},{no:27,id:"3605",name:"박규현"},
  {no:28,id:"3609",name:"유길상"},{no:29,id:"3617",name:"이서준"},{no:30,id:"3624",name:"정성호"},
  {no:31,id:"3627",name:"조영준"},{no:32,id:"3630",name:"한태옥"},{no:33,id:"3713",name:"박재민"},
];

const DEF_Q=[
  {id:"q1",subject:"화법과 작문",title:"통계 보도문 읽기와 발표",maxLen:600,image:null,
   question:"우리 반 학생 30명의 일주일 독서 시간을 조사한 결과, 평균 2.4시간, 표준편차 1.8시간이었습니다.",
   subQuestion:"① 자료의 특성을 해석하는 2~3문장의 발표 도입부\n② 독서 시간 부족 이유와 개선 방안 단락",
   placeholder:"① 우리 반 학생들의 일주일 평균 독서 시간은...",
   rubric:["통계 해석 정확성","발표 도입부 구성","주장의 논리성","표현의 명확성"]},
  {id:"q2",subject:"확률과 통계",title:"경우의 수와 이야기 만들기",maxLen:500,image:null,
   question:"5명(A,B,C,D,E)이 원형 탁자에 앉는 경우의 수를 구하고, 계산 과정을 '이야기 형식'으로 설명하는 글을 작성하세요.",
   subQuestion:"- 수학적 계산 과정이 글 속에 자연스럽게 드러나야 합니다.\n- 등장인물과 상황을 직접 설정하세요.",
   placeholder:"다섯 친구가 생일 파티에 모였다...",
   rubric:["경우의 수 정확성","서사 구성력","수학과 이야기의 통합","창의성"]},
  {id:"q3",subject:"화법과 작문 + 확률과 통계",title:"설득 발표문 — 확률로 근거 만들기",maxLen:700,image:null,
   question:"아래 데이터를 활용하여 '자율학습 선택권 도입' 발표문(서론-본론-결론)을 작성하세요.",
   subQuestion:"• 자율학습 참여 학생 성적 향상: 62%\n• 강제 자율학습 만족도 '낮음': 58%\n• 선택 학교 스트레스 점수: 4.1/10 (비선택: 6.8/10)",
   placeholder:"서론: 매일 저녁 교실에 앉아 있어야 하는 강제 자율학습...",
   rubric:["발표문 구조","통계 근거 활용","설득력","논리적 흐름"]},
  {id:"q4",subject:"확률과 통계",title:"조건부 확률 스토리텔링",maxLen:500,image:null,
   question:"유병률 1%, 민감도 95%, 특이도 90%인 검사에서 양성 판정 시 실제 환자일 확률(양성예측도)을 베이즈 정리로 계산하고, 의사-환자 대화 형식으로 작성하세요.",
   subQuestion:"",
   placeholder:"의사: 검사 결과가 양성으로 나왔습니다만...",
   rubric:["베이즈 정리 적용","계산 정확성","대화 형식","개념 이해도"]},
];

const PERIODS=[1,2,3,4,5,6,7];
const KOR_COMP=["비판적·창의적 사고 역량","자료·정보 활용 역량","의사소통 역량","공동체·대인관계 역량","문화 향유 역량","자기 성찰·계발 역량"];
const MATH_COMP=["문제해결 역량","추론 역량","의사소통 역량","연결 역량","정보처리 역량"];
const THEMES=["통계와 사회","확률과 의사결정","데이터 리터러시","수리적 글쓰기","논증과 통계"];

/* ───────── 스타일 헬퍼 ───────── */
const cv={lav:"#7c5cbf",lavLt:"#ede9ff",lavMd:"#c5b8f5",mint:"#2d7a5e",mintLt:"#e6f9f2",mintMd:"#a8e6cf",rose:"#b03060",roseLt:"#fff0f4",roseMd:"#f5b8c8",peachDk:"#c05c1a",peachLt:"#fff4ec",peachMd:"#ffcba4",skyLt:"#e8f4fd",skyMd:"#b3d9f7",skyDk:"#1a6ea8",ink:"#2d2840",ink2:"#4a4560",muted:"#8882a8",bg:"#f0f4ff",border:"#e2dcf5",border2:"#cec8ea"};
const crd=(ex={})=>({background:"#fff",border:`1.5px solid ${cv.border}`,borderRadius:13,padding:"1.3rem",boxShadow:"0 2px 14px rgba(124,92,191,.09)",...ex});
const btn=(bg,col="#fff",ex={})=>({background:bg,color:col,border:"none",borderRadius:8,padding:".58rem 1.15rem",fontWeight:700,cursor:"pointer",fontSize:".86rem",fontFamily:"inherit",transition:"filter .15s",...ex});
const pill=(bg,col,bc)=>({background:bg,color:col,border:`1px solid ${bc}`,borderRadius:20,padding:".22rem .7rem",fontSize:".74rem",fontWeight:700,display:"inline-flex",alignItems:"center",whiteSpace:"nowrap"});
const inp=(ex={})=>({width:"100%",border:`1.5px solid ${cv.border2}`,borderRadius:8,padding:".65rem .9rem",fontSize:".92rem",outline:"none",fontFamily:"inherit",background:"#fff",...ex});

/* ───────── localStorage 헬퍼 ───────── */
const ls={
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
};

const mkAct=()=>({korComp:[],mathComp:[],obs1:"",obs2:"",prompt:"",bytes:500});

/* ══════════════════════════════════════════════════
   메인 앱
══════════════════════════════════════════════════ */
function App(){
  /* 학생 */
  const [page,setPage]=useState("login");
  const [stuId,setStuId]=useState("");
  const [stuName,setStuName]=useState("");
  const [stuErr,setStuErr]=useState("");
  const [answers,setAnswers]=useState({});
  const [curQ,setCurQ]=useState(0);
  const [submitted,setSubmitted]=useState(null);
  /* 교사 */
  const [teacherPw,setTeacherPw]=useState(()=>ls.get("pw","1234"));
  const [pwInput,setPwInput]=useState("");
  const [pwShake,setPwShake]=useState(false);
  const [tab,setTab]=useState("dashboard");
  const [submissions,setSubmissions]=useState(()=>ls.get("subs",[]));
  const [apiKey,setApiKey]=useState(()=>ls.get("api",""));
  const [questions,setQuestions]=useState(()=>ls.get("qs",DEF_Q));
  const [expandedQ,setExpandedQ]=useState(null);
  const [savedQ,setSavedQ]=useState(false);
  const [newPw,setNewPw]=useState("");
  /* 출석 */
  const [att,setAtt]=useState(()=>ls.get("att",{}));
  const [attNote,setAttNote]=useState(()=>ls.get("attNote",{}));
  const [attSaved,setAttSaved]=useState(false);
  /* 드라이브 */
  const [driveSub,setDriveSub]=useState(()=>ls.get("driveSub",{}));
  const [driveUrls,setDriveUrls]=useState(()=>ls.get("driveUrls",{}));
  const [rootUrl,setRootUrl]=useState(()=>ls.get("rootUrl",""));
  const [driveSaved,setDriveSaved]=useState(false);
  /* 활동지 교세특 */
  const [seteuk,setSeteuk]=useState(null);
  const [generating,setGenerating]=useState(false);
  const [genProg,setGenProg]=useState(0);
  const [tNote,setTNote]=useState("");
  /* 세특 작성 메뉴 */
  const [setkStu,setSetkStu]=useState("");
  const [setkTheme,setSetkTheme]=useState("");
  const [setkExtras,setSetkExtras]=useState(()=>DEF_Q.map(()=>mkAct()));
  const [setkResult,setSetkResult]=useState(null);
  const [setkPartResult,setSetkPartResult]=useState({});
  const [setkGen,setSetkGen]=useState(false);
  const [setkPartGen,setSetkPartGen]=useState({});
  const [rightActIdx,setRightActIdx]=useState(null); // null=전체, n=활동n

  /* questions 길이 변경 시 setkExtras 동기화 */
  useEffect(()=>{
    setSetkExtras(prev=>{
      if(prev.length===questions.length)return prev;
      return questions.map((_,i)=>prev[i]||mkAct());
    });
  },[questions.length]);

  /* ── 출석 ── */
  const toggleAtt=(id,p)=>setAtt(prev=>{
    const cur=(prev[id]||{})[p]||"";
    return{...prev,[id]:{...(prev[id]||{}),[p]:cur==="/"?"":"/"}};
  });
  const setAllPresent=()=>setAtt({});
  const saveAtt=()=>{ls.set("att",att);ls.set("attNote",attNote);setAttSaved(true);setTimeout(()=>setAttSaved(false),2200);};
  const presentCnt=()=>ROSTER.filter(s=>!PERIODS.some(p=>(att[s.id]||{})[p]==="/" )).length;
  const absentCnt=()=>ROSTER.filter(s=>PERIODS.some(p=>(att[s.id]||{})[p]==="/")).length;

  /* ── 엑셀 내보내기 ── */
  const exportExcel=()=>{
    const today=new Date().toLocaleDateString("ko-KR");
    const header=["연번","학번","이름",...PERIODS.map(p=>p+"교시"),"비고"];
    const rows=ROSTER.map(s=>[s.no,s.id,s.name,...PERIODS.map(p=>(att[s.id]||{})[p]==="/"?"결석":"출석"),attNote[s.id]||""]);
    const sumRow=["","","합계",...PERIODS.map(p=>`출석:${ROSTER.filter(s=>(att[s.id]||{})[p]!=="/" ).length} 결석:${ROSTER.filter(s=>(att[s.id]||{})[p]==="/").length}`),""];
    const csv="﻿"+[["화법과 작문 × 확률과 통계 출석현황 ("+today+")"],[], header,...rows,[], sumRow]
      .map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
    a.download=`출석현황_${today.replace(/\./g,"")}.csv`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  };

  /* ── 드라이브 자동 매칭 ── */
  const autoMatch=()=>{
    if(!rootUrl.trim()){alert("상위 폴더 URL을 먼저 입력하세요.");return;}
    const base=rootUrl.trim().replace(/\/+$/,"");
    const n={...driveUrls};
    ROSTER.forEach(s=>{if(!n[s.id])n[s.id]=`${base}/${encodeURIComponent(s.name)}`;});
    setDriveUrls(n);ls.set("driveUrls",n);
    alert("학생 이름 기준으로 폴더 URL이 자동 연결되었습니다.\n실제 폴더와 일치하는지 확인 후 수동 수정 가능합니다.");
  };

  /* ── 제출 상태 ── */
  const wsSet=new Set(submissions.map(s=>s.stuId));
  const getStatus=s=>{const ws=wsSet.has(s.id),dr=!!driveSub[s.id];if(ws&&dr)return"complete";if(ws)return"ws";if(dr)return"dr";return"none";};
  const stLabel={"complete":"✅ 완료","ws":"📝 활동지만","dr":"📁 드라이브만","none":"❌ 미제출"};
  const stC={"complete":[cv.mintLt,cv.mint,cv.mintMd],"ws":[cv.lavLt,cv.lav,cv.lavMd],"dr":["#e0f9ec","#1a7a46","#7ad9a0"],"none":[cv.roseLt,cv.rose,cv.roseMd]};

  /* ── 학생 로그인 ── */
  const loginStudent=()=>{
    if(!/^\d{4}$/.test(stuId.trim())){setStuErr("4자리 학번을 입력해 주세요");return;}
    if(!stuName.trim()){setStuErr("성명을 입력해 주세요");return;}
    if(!ROSTER.find(r=>r.id===stuId.trim()&&r.name===stuName.trim())){setStuErr("학번 또는 성명이 일치하지 않습니다");return;}
    setStuErr("");setPage("worksheet");setCurQ(0);
  };

  /* ── 교사 키패드 ── */
  const handleNumpad=n=>{
    if(pwInput.length>=6)return;
    const next=pwInput+n;setPwInput(next);
    if(next.length===teacherPw.length){
      setTimeout(()=>{
        if(next===teacherPw){setPage("teacher");setPwInput("");}
        else{setPwShake(true);setTimeout(()=>{setPwShake(false);setPwInput("");},600);}
      },150);
    }
  };

  /* ── 활동지 제출 ── */
  const submitWS=()=>{
    const bad=questions.filter(q=>(answers[q.id]?.text||"").trim().length<20);
    if(bad.length){alert("답변이 너무 짧습니다 (최소 20자):\n"+bad.map(q=>q.title).join(", "));return;}
    const data={stuId,stuName,answers,at:new Date().toLocaleString("ko-KR")};
    setSubmitted(data);
    const next=[...submissions,data];setSubmissions(next);ls.set("subs",next);
    setPage("review");
  };

  /* ── AI 공통 호출 ── */
  const callAI=async(prompt,key)=>{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1200,messages:[{role:"user",content:prompt}]})
    });
    const d=await res.json();
    if(d.error)throw new Error(d.error.message);
    return(d.content||[]).map(x=>x.text||"").join("")||"생성 결과 없음";
  };
  const getKey=()=>{
    let k=apiKey;
    if(!k){k=prompt("Anthropic API 키를 입력하세요.");if(!k)return null;setApiKey(k);ls.set("api",k);}
    return k;
  };

  /* ── 활동지 교세특 생성 ── */
  const generate=async()=>{
    const key=getKey();if(!key)return;
    setGenerating(true);setSeteuk(null);setGenProg(0);
    const timer=setInterval(()=>setGenProg(p=>Math.min(p+Math.random()*9,88)),400);
    try{
      const text=await callAI(
        `고등학교 교사로서 학생의 교과 융합수업 활동지를 바탕으로 교세특을 500자 내외로 작성해주세요.\n`+
        `학생: ${submitted.stuName} (학번: ${submitted.stuId})\n\n`+
        questions.map(q=>`[${q.title}]\n문항: ${q.question}\n답변: ${submitted.answers[q.id]?.text||"(미작성)"}`).join("\n\n")+
        (tNote?`\n\n[교사 관찰]\n${tNote}`:"")+
        `\n\n지침: 3인칭, "해당 학생" 표현, 교세특 내용만 작성`,
        key
      );
      clearInterval(timer);setGenProg(100);
      setTimeout(()=>{setSeteuk(text);setGenerating(false);setPage("result");},450);
    }catch(e){clearInterval(timer);setGenerating(false);setSeteuk("오류: "+e.message);setPage("result");}
  };

  /* ── 세특 학생 선택 ── */
  const onSetkStuChange=id=>{
    setSetkStu(id);
    setSetkPartResult({});setSetkResult(null);setRightActIdx(null);
  };
  const getSetkSub=()=>submissions.find(s=>s.stuId===setkStu)||null;

  /* ── 활동별 세특 생성 ── */
  const generateActSetk=async(ai)=>{
    const key=getKey();if(!key)return;
    const ext=setkExtras[ai];const q=questions[ai];
    const stu=ROSTER.find(s=>s.id===setkStu);
    const sub=getSetkSub();
    const stuAns=sub?.answers[q?.id]?.text||"(제출 없음)";
    setSetkPartGen(p=>({...p,[ai]:true}));
    setRightActIdx(ai);
    try{
      const text=await callAI(
        `학생 ${stu?.name||"(미선택)"}의 활동 ${ai+1} [${q?.title||""}] 기록으로 교세특 초안을 약 ${ext.bytes}바이트로 작성하세요.\n`+
        `문항 내용: ${q?.question||""}\n`+
        `학생 답변: ${stuAns}\n`+
        `국어 역량: ${ext.korComp.join(", ")||"없음"}\n`+
        `수학 역량: ${ext.mathComp.join(", ")||"없음"}\n`+
        `교사 프롬프트: ${ext.prompt||"없음"}\n`+
        `교사1 관찰: ${ext.obs1||"없음"}\n`+
        `교사2 관찰: ${ext.obs2||"없음"}\n`+
        `지침: 3인칭, "해당 학생", 세특 내용만 작성`,
        key
      );
      setSetkPartResult(p=>({...p,[ai]:text}));

                            {setkPartGen[ai]?"⏳ 생성 중...":` ✦ 활동 ${ai+1} 세특 초안 작성하기`}
                          </button>
                        </div>
                      );
                    })}

                    {/* 전체 생성 버튼 */}
                    <button onClick={generateAllSetk} disabled={setkGen} style={{...btn(`linear-gradient(135deg,${cv.lav},${cv.mint})`),width:"100%",padding:".95rem",fontSize:"1rem",borderRadius:11,boxShadow:"0 4px 16px rgba(124,92,191,.22)",opacity:setkGen?.6:1}}>
                      {setkGen?"⏳ 전체 생성 중...":`✦ ${questions.length}개 활동 전체 교과 세특 생성하기 ✦`}
                    </button>
                  </div>

                  {/* 우측 패널 — 3차: 활동별 즉시 표시 */}
                  <div style={{position:"sticky",top:"1.5rem"}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:".85rem",flexWrap:"wrap",gap:".4rem"}}>
                      <div style={{fontWeight:700,fontSize:"1rem",color:cv.ink}}>📄 {rightTitle}</div>
                      <div style={{display:"flex",gap:".3rem",flexWrap:"wrap"}}>
                        <button onClick={()=>setRightActIdx(null)} style={{...btn(rightActIdx===null?cv.lav:cv.bg,rightActIdx===null?"#fff":cv.muted),border:`1px solid ${rightActIdx===null?cv.lav:cv.border2}`,borderRadius:20,fontSize:".73rem",padding:".2rem .62rem"}}>전체</button>
                        {questions.map((_,i)=>(
                          <button key={i} onClick={()=>setRightActIdx(i)} style={{...btn(rightActIdx===i?cv.lav:cv.bg,rightActIdx===i?"#fff":cv.muted),border:`1px solid ${rightActIdx===i?cv.lav:cv.border2}`,borderRadius:20,fontSize:".73rem",padding:".2rem .62rem"}}>활동{i+1}</button>
                        ))}
                      </div>
                    </div>

                    {rightLoading
                      ?<div style={{...crd(),textAlign:"center",padding:"3.5rem"}}>
                          <div style={{width:42,height:42,border:`3px solid ${cv.border}`,borderTopColor:cv.lav,borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 1rem"}}/>
                          <div style={{color:cv.muted,fontSize:".9rem"}}>생성 중...</div>
                        </div>
                      :rightContent
                        ?<div style={{...crd(),position:"relative"}}>
                            <div style={{position:"absolute",top:-12,left:"1.2rem",background:cv.lavMd,padding:".1rem .58rem",fontSize:".69rem",fontWeight:700,color:cv.ink,letterSpacing:".1em",borderRadius:20}}>세부능력 및 특기사항</div>
                            <p style={{fontSize:".93rem",lineHeight:2.05,color:cv.ink,whiteSpace:"pre-wrap",wordBreak:"keep-all",marginTop:".4rem"}}>{rightContent}</p>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:".9rem",paddingTop:".75rem",borderTop:`1px solid ${cv.border}`}}>
                              <span style={{fontSize:".76rem",color:cv.muted}}>{rightContent.length}자</span>
                              <button onClick={()=>navigator.clipboard.writeText(rightContent).then(()=>alert("클립보드에 복사되었습니다!")).catch(()=>alert("복사 실패"))} style={{...btn(`linear-gradient(135deg,${cv.mint},#27ae60)`),padding:".48rem 1.1rem",fontSize:".85rem"}}>📋 클립보드 복사</button>
                            </div>
                          </div>
                        :<div style={{...crd({border:`1.5px dashed ${cv.border2}`}),textAlign:"center",padding:"4rem 1.5rem",color:cv.muted,fontSize:".9rem"}}>
                            <div style={{fontSize:"2.8rem",marginBottom:".9rem"}}>📝</div>
                            활동별 초안 또는 전체 세특을<br/>생성하면 여기에 표시됩니다
                          </div>
                    }
                  </div>
                </div>
              );
            })()}

            {/* ══ 환경설정 ══ */}
            {tab==="settings"&&(
              <>
                <div style={{fontWeight:800,fontSize:"1.3rem",marginBottom:"1.4rem",color:cv.ink}}>⚙️ 환경설정</div>
                <div style={{...crd(),marginBottom:"1rem"}}>
                  <div style={{fontWeight:700,marginBottom:"1rem",fontSize:".97rem"}}>🔑 Anthropic API Key</div>
                  <input type="password" style={inp()} placeholder="sk-ant-..." value={apiKey} onChange={e=>{setApiKey(e.target.value);ls.set("api",e.target.value);}}/>
                  <div style={{fontSize:".76rem",color:cv.muted,marginTop:".3rem"}}>교세특 AI 생성 시 필요합니다. 이 브라우저에만 저장됩니다.</div>
                </div>
                <div style={{...crd(),marginBottom:"1rem"}}>
                  <div style={{fontWeight:700,marginBottom:"1rem",fontSize:".97rem"}}>🔒 교사 비밀번호 변경</div>
                  <div style={{display:"flex",gap:".75rem",alignItems:"flex-end"}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:".78rem",fontWeight:700,color:cv.ink2,marginBottom:".3rem"}}>새 비밀번호 (숫자)</div>
                      <input type="password" style={inp()} placeholder="숫자만 입력" value={newPw} onChange={e=>setNewPw(e.target.value.replace(/\D/g,"").slice(0,8))}/>
                    </div>
                    <button onClick={()=>{if(newPw.length<2){alert("최소 2자리");return;}setTeacherPw(newPw);ls.set("pw",newPw);setNewPw("");alert(`비밀번호가 "${newPw}"로 변경되었습니다.`);}} style={btn(`linear-gradient(135deg,${cv.lav},#9b59b6)`)}>변경</button>
                  </div>
                  <div style={{fontSize:".76rem",color:cv.muted,marginTop:".3rem"}}>현재 비밀번호: {teacherPw}</div>
                </div>
                <div style={{display:"flex",gap:".9rem",flexWrap:"wrap"}}>
                  <button onClick={()=>{if(window.confirm("제출 데이터를 전부 삭제하시겠습니까?"))setSubmissions([]);}} style={{...btn(cv.roseLt,cv.rose),border:`1px solid ${cv.roseMd}`}}>제출 데이터 전체 삭제</button>
                  <button onClick={()=>{if(window.confirm("문항을 기본값으로 복원하시겠습니까?"))setQuestions(DEF_Q);}} style={{...btn(cv.roseLt,cv.rose),border:`1px solid ${cv.roseMd}`}}>문항 기본값 복원</button>
                </div>
              </>
            )}

          </main>
        </div>
      </div>
    );
  }

  /* ════════════════════════════════════════
     PAGE: WORKSHEET
  ════════════════════════════════════════ */
  if(page==="worksheet"){
    const q=questions[curQ];if(!q)return null;
    const ans=answers[q.id]||{text:"",imgData:null,imgText:""};
    const cnt=(ans.text||"").length;
    const updAns=(f,v)=>setAnswers(p=>({...p,[q.id]:{...(p[q.id]||{}),[f]:v}}));
    return(
      <div style={{background:cv.bg,minHeight:"100vh"}}>
        {generating&&<Spinner prog={genProg}/>}
        <NavBar name={stuName} sub={`학번 ${stuId}`}/>
        <div style={{maxWidth:820,margin:"0 auto",padding:"1.8rem 1.2rem 4rem"}}>
          <div style={{textAlign:"center",padding:"1.8rem 1rem 1.6rem",marginBottom:"1.6rem",borderBottom:`2px solid ${cv.border}`}}>
            <div style={{fontSize:".74rem",letterSpacing:".22em",color:cv.muted,marginBottom:".35rem"}}>고등학교 교과 융합 활동지</div>
            <h1 style={{fontWeight:900,fontSize:"1.65rem",color:cv.ink,marginBottom:".45rem"}}>화법과 작문 × 확률과 통계</h1>
            <div style={{display:"flex",gap:".5rem",justifyContent:"center",marginBottom:".75rem"}}>
              <span style={pill(cv.lavLt,cv.lav,cv.lavMd)}>📖 화법과 작문</span>
              <span style={pill(cv.mintLt,cv.mint,cv.mintMd)}>📊 확률과 통계</span>
            </div>
            <div style={{display:"inline-flex",gap:"1.5rem",border:`1.5px solid ${cv.border}`,padding:".5rem 1.4rem",borderRadius:22,fontSize:".88rem",background:"#fff"}}>
              <span><span style={{color:cv.muted,fontSize:".78rem"}}>이름 </span>{stuName}</span>
              <span><span style={{color:cv.muted,fontSize:".78rem"}}>학번 </span>{stuId}</span>
            </div>
          </div>
          <div style={{marginBottom:"1.5rem"}}>
            <div style={{textAlign:"center",fontSize:".84rem",color:cv.muted,background:"#fff",border:`1.5px solid ${cv.border}`,borderRadius:22,padding:".5rem 1.1rem",marginBottom:".55rem"}}>
              <strong style={{color:cv.ink}}>{doneCount}/{questions.length}</strong>개 활동 완료{doneCount===questions.length&&<span style={{color:cv.mint,fontWeight:700}}> ✓ 모두 완료!</span>}
            </div>
            <div style={{height:7,background:cv.border,borderRadius:999,overflow:"hidden"}}>
              <div style={{height:"100%",width:((doneCount/Math.max(questions.length,1))*100)+"%",background:`linear-gradient(90deg,${cv.lavMd},${cv.mintMd})`,transition:"width .4s"}}/>
            </div>
          </div>
          <div style={{display:"flex",gap:".45rem",flexWrap:"wrap",marginBottom:"1.3rem"}}>
            {questions.map((qq,i)=>{
              const done=(answers[qq.id]?.text||"").trim().length>=20,active=curQ===i;
              return<button key={qq.id} onClick={()=>setCurQ(i)} style={{padding:".38rem .88rem",fontSize:".79rem",border:`1.5px solid ${active?cv.lav:done?cv.mint:cv.border2}`,background:active?cv.lav:done?cv.mintLt:"#fff",color:active?"#fff":done?cv.mint:cv.muted,borderRadius:22,cursor:"pointer",fontWeight:700}}>{i+1}. {qq.title}{done?" ✓":""}</button>;
            })}
          </div>
          <div style={{...crd(),marginBottom:"1.1rem",animation:"fadeUp .25s ease"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:".6rem"}}>
              <span style={{fontWeight:900,fontSize:"2rem",color:cv.border2,lineHeight:1}}>0{curQ+1}</span>
              <span style={pill(cv.lavLt,cv.lav,cv.lavMd)}>{q.subject}</span>
            </div>
            <div style={{fontWeight:800,fontSize:"1.08rem",color:cv.ink,marginBottom:".55rem"}}>{q.title}</div>
            {q.rubric.length>0&&<div style={{display:"flex",gap:".35rem",flexWrap:"wrap",marginBottom:".9rem"}}>{q.rubric.map(r=><span key={r} style={pill(cv.peachLt,cv.peachDk,cv.peachMd)}>◆ {r}</span>)}</div>}
            {q.image&&<div style={{marginBottom:"1rem",borderRadius:10,overflow:"hidden",border:`1.5px solid ${cv.border}`}}><img src={q.image} alt="문항 이미지" style={{width:"100%",display:"block",maxHeight:330,objectFit:"contain",background:"#f8f9fc"}}/></div>}
            <div style={{fontSize:".9rem",lineHeight:1.9,color:cv.ink2,whiteSpace:"pre-line",background:cv.skyLt,borderLeft:"3px solid "+cv.skyMd,padding:".9rem 1.1rem",borderRadius:"0 9px 9px 0",marginBottom:".75rem"}}>{q.question}</div>
            {q.subQuestion&&<div style={{fontSize:".88rem",lineHeight:1.9,color:cv.ink2,whiteSpace:"pre-line",background:"#fffbf0",borderLeft:`3px solid ${cv.peachMd}`,padding:".82rem 1.1rem",borderRadius:"0 9px 9px 0",marginBottom:"1rem"}}>{q.subQuestion}</div>}
            <div style={{fontSize:".79rem",fontWeight:700,color:cv.ink2,marginBottom:".35rem"}}>✏️ 활동 답변 작성</div>
            <textarea style={{...inp(),minHeight:140,resize:"vertical",lineHeight:1.9,background:"#fafcff"}} placeholder={q.placeholder||"답변을 입력하세요..."} value={ans.text} maxLength={q.maxLen} onChange={e=>updAns("text",e.target.value)}/>
            <div style={{textAlign:"right",fontSize:".76rem",color:cnt>q.maxLen*.9?cv.rose:cv.muted,marginTop:".25rem",fontWeight:cnt>q.maxLen*.9?700:400}}>{cnt} / {q.maxLen}자</div>
            <div style={{marginTop:"1.1rem"}}>
              <div style={{fontSize:".79rem",fontWeight:700,color:cv.ink2,marginBottom:".35rem"}}>📸 활동지 사진 업로드 <span style={{color:cv.muted,fontWeight:400}}>(선택)</span></div>
              <StuImgUpload value={ans.imgData} onChange={v=>updAns("imgData",v)}/>
            </div>
            {ans.imgData&&(
              <div style={{marginTop:"1rem"}}>
                <div style={{fontSize:".79rem",fontWeight:700,color:cv.ink2,marginBottom:".35rem"}}>📝 이미지 내용 텍스트로 옮겨 작성</div>
                <textarea style={{...inp(),minHeight:95,resize:"vertical",lineHeight:1.8,background:"#fafcff"}} placeholder="업로드한 이미지의 내용을 텍스트로 작성하세요..." value={ans.imgText} onChange={e=>updAns("imgText",e.target.value)}/>
              </div>
            )}
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:"1.3rem",borderTop:`1.5px solid ${cv.border}`}}>
            <button disabled={curQ===0} onClick={()=>setCurQ(p=>p-1)} style={{...btn("#fff",cv.ink2),border:`1.5px solid ${cv.border2}`,borderRadius:22,padding:".54rem 1.2rem",opacity:curQ===0?.35:1}}>← 이전</button>
            {curQ<questions.length-1
              ?<button onClick={()=>setCurQ(p=>p+1)} style={{...btn("#fff",cv.ink2),border:`1.5px solid ${cv.border2}`,borderRadius:22,padding:".54rem 1.2rem"}}>다음 →</button>
              :<button onClick={submitWS} style={{...btn("linear-gradient(135deg,#c05c1a,#e67e22)"),borderRadius:22,padding:".56rem 1.6rem",fontSize:".95rem"}}>활동지 제출하기 →</button>
            }
          </div>
        </div>
      </div>
    );
  }

  /* ════════════════════════════════════════
     PAGE: REVIEW
  ════════════════════════════════════════ */
  if(page==="review"&&submitted)return(
    <div style={{background:cv.bg,minHeight:"100vh"}}>
      {generating&&<Spinner prog={genProg}/>}
      <NavBar name={submitted.stuName} sub={submitted.at}/>
      <div style={{maxWidth:820,margin:"0 auto",padding:"1.8rem 1.2rem 4rem"}}>
        <div style={{textAlign:"center",marginBottom:"1.9rem"}}>
          <h1 style={{fontWeight:800,fontSize:"1.55rem",color:cv.ink,marginBottom:".35rem"}}>활동지 제출 완료 🎉</h1>
          <p style={{fontSize:".88rem",color:cv.muted}}>AI 교세특 생성을 진행하거나 처음으로 돌아갈 수 있습니다</p>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:".9rem",marginBottom:"1.6rem"}}>
          {questions.map(q=>{
            const ans=submitted.answers[q.id]||{};
            return(
              <div key={q.id} style={crd()}>
                <div style={{background:`linear-gradient(90deg,${cv.lavMd},${cv.mintMd})`,padding:".62rem 1.1rem",margin:"-1.3rem -1.3rem 1rem",display:"flex",justifyContent:"space-between",borderRadius:"11px 11px 0 0"}}>
                  <strong style={{fontSize:".95rem",color:cv.ink}}>{q.title}</strong>
                  <span style={{fontSize:".76rem",color:cv.ink2}}>{q.subject}</span>
                </div>
                <div style={{fontSize:".9rem",lineHeight:1.9,whiteSpace:"pre-wrap",color:cv.ink2,marginBottom:ans.imgData?".9rem":0}}>{ans.text||"(미작성)"}</div>
                {ans.imgData&&<div style={{borderRadius:9,overflow:"hidden",border:`1px solid ${cv.border}`,marginBottom:ans.imgText?".65rem":0}}><img src={ans.imgData} alt="업로드 이미지" style={{width:"100%",maxHeight:210,objectFit:"contain",background:"#f8f9fc",display:"block"}}/></div>}
                {ans.imgText&&<div style={{fontSize:".87rem",color:cv.ink2,whiteSpace:"pre-wrap",borderTop:`1px solid ${cv.border}`,paddingTop:".65rem"}}><span style={{color:cv.muted,fontSize:".76rem",fontWeight:700}}>이미지 내용: </span>{ans.imgText}</div>}
              </div>
            );
          })}
        </div>
        <div style={{...crd(),marginBottom:"1.4rem"}}>
          <div style={{fontWeight:700,fontSize:".95rem",color:cv.ink2,marginBottom:".65rem"}}>📝 교사 추가 관찰 사항 <span style={{fontWeight:400,fontSize:".82rem",color:cv.muted}}>(선택)</span></div>
          <textarea style={{...inp(),height:82,resize:"vertical",background:"#fafcff",lineHeight:1.75}} placeholder="예) 수업 중 적극적으로 발표하였으며..." value={tNote} onChange={e=>setTNote(e.target.value)}/>
        </div>
        <button onClick={generate} disabled={generating} style={{...btn(`linear-gradient(135deg,${cv.lav},${cv.mint})`),width:"100%",padding:".95rem",fontSize:"1rem",borderRadius:11,boxShadow:"0 4px 16px rgba(124,92,191,.22)",opacity:generating?.6:1}}>✦ AI 교세특 자동 생성하기 ✦</button>
      </div>
    </div>
  );

  /* ════════════════════════════════════════
     PAGE: RESULT
  ════════════════════════════════════════ */
  if(page==="result"&&seteuk&&submitted)return(
    <div style={{background:cv.bg,minHeight:"100vh"}}>
      <NavBar/>
      <div style={{maxWidth:720,margin:"0 auto",padding:"2.2rem 1.2rem 4rem"}}>
        <div style={{textAlign:"center",marginBottom:"1.9rem"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:".65rem",marginBottom:".45rem"}}>
            <h1 style={{fontWeight:800,fontSize:"1.55rem",color:cv.ink}}>교세특 생성 완료</h1>
            <span style={pill(cv.mintLt,cv.mint,cv.mintMd)}>✓ 완료</span>
          </div>
          <div style={{display:"flex",justifyContent:"center",gap:"1.3rem",fontSize:".84rem",color:cv.muted,flexWrap:"wrap"}}>
            <span>학생: <strong style={{color:cv.ink2}}>{submitted.stuName}</strong></span>
            <span>학번: <strong style={{color:cv.ink2}}>{submitted.stuId}</strong></span>
            <span>생성일: <strong style={{color:cv.ink2}}>{new Date().toLocaleDateString("ko-KR")}</strong></span>
          </div>
        </div>
        <div style={{...crd({padding:"2rem 2.2rem"}),position:"relative",marginBottom:"1.5rem"}}>
          <div style={{position:"absolute",top:-12,left:"1.3rem",background:cv.lavMd,padding:".1rem .58rem",fontSize:".7rem",fontWeight:700,color:cv.ink,letterSpacing:".1em",borderRadius:20}}>세부능력 및 특기사항</div>
          <p style={{fontSize:".95rem",lineHeight:2.1,color:cv.ink,whiteSpace:"pre-wrap",wordBreak:"keep-all"}}>{seteuk}</p>
          <div style={{textAlign:"right",marginTop:".9rem",paddingTop:".75rem",borderTop:`1px solid ${cv.border}`,fontSize:".78rem",color:cv.muted}}>{seteuk.length}자</div>
        </div>
        <div style={{display:"flex",gap:".8rem",flexWrap:"wrap"}}>
          <button onClick={()=>navigator.clipboard.writeText(seteuk).then(()=>alert("클립보드에 복사되었습니다!")).catch(()=>alert("복사 실패"))} style={{...btn(`linear-gradient(135deg,${cv.mint},#27ae60)`),flex:1,padding:".78rem",minWidth:100}}>📋 클립보드 복사</button>
          <button onClick={()=>{setSeteuk(null);setPage("review");}} style={{...btn("#fff",cv.ink),border:`1.5px solid ${cv.border2}`,flex:1,padding:".78rem",minWidth:100}}>↺ 다시 생성</button>
          <button onClick={reset} style={{...btn("#fff",cv.muted),border:`1px solid ${cv.border}`,flex:1,padding:".78rem",minWidth:100}}>처음으로</button>
        </div>
      </div>
    </div>
  );

  return null;
}

/* ══════════════════════════
   서브 컴포넌트
══════════════════════════ */
function StuImgUpload({value,onChange}){
  const ref=useRef();
  const handleFile=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>onChange(ev.target.result);r.readAsDataURL(f);e.target.value="";};
  return(
    <div>
      {value
        ?<div style={{position:"relative",width:"100%",marginBottom:".4rem"}}>
           <img src={value} alt="업로드 이미지" style={{maxWidth:"100%",maxHeight:230,borderRadius:9,border:"1.5px solid #e2dcf5",display:"block"}}/>
           <button onClick={()=>onChange(null)} style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,.55)",border:"none",borderRadius:"50%",width:26,height:26,color:"#fff",cursor:"pointer",fontSize:".9rem",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
         </div>
        :<div onClick={()=>ref.current.click()} style={{border:"1.5px dashed #cec8ea",borderRadius:9,padding:"1.2rem",textAlign:"center",cursor:"pointer",background:"#fafcff",color:"#8882a8",fontSize:".86rem",lineHeight:1.7}}>
           📷 활동지 사진을 업로드하세요<br/><span style={{fontSize:".76rem"}}>이미지 파일 (jpg, png 등)</span>
         </div>
      }
      <input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={handleFile}/>
    </div>
  );
}

function CompCheck({label,items,sel,onChange}){
  const tog=item=>onChange(sel.includes(item)?sel.filter(x=>x!==item):[...sel,item]);
  return(
    <div style={{background:"#f8f9fc",borderRadius:9,padding:".72rem .88rem",border:"1px solid #e2dcf5"}}>
      <div style={{fontSize:".76rem",fontWeight:700,color:"#4a4560",marginBottom:".45rem"}}>{label}</div>
      {items.map(item=>(
        <label key={item} style={{display:"flex",alignItems:"center",gap:".38rem",cursor:"pointer",fontSize:".82rem",color:sel.includes(item)?"#7c5cbf":"#4a4560",fontWeight:sel.includes(item)?700:400,marginBottom:".3rem"}}>
          <input type="checkbox" checked={sel.includes(item)} onChange={()=>tog(item)} style={{accentColor:"#7c5cbf"}}/>{item}
        </label>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
