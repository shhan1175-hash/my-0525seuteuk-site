/* ── AI 호출 ── */
async function callAI(prompt,engine,keys){
  if(engine==="Claude"){
    const key=keys.claude;if(!key)throw new Error("Claude API 키가 없습니다.");
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1200,messages:[{role:"user",content:prompt}]})});
    const d=await res.json();if(d.error)throw new Error(d.error.message);
    return(d.content||[]).map(x=>x.text||"").join("")||"생성 결과 없음";
  }
  if(engine==="Gemini"){
    const key=keys.gemini;if(!key)throw new Error("Gemini API 키가 없습니다.");
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:1200}})});
    const d=await res.json();if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
    return d.candidates?.[0]?.content?.parts?.[0]?.text||"생성 결과 없음";
  }
  if(engine==="ChatGPT"){
    const key=keys.openai;if(!key)throw new Error("OpenAI API 키가 없습니다.");
    const res=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},body:JSON.stringify({model:"gpt-4o",max_tokens:1200,messages:[{role:"user",content:prompt}]})});
    const d=await res.json();if(d.error)throw new Error(d.error.message);
    return d.choices?.[0]?.message?.content||"생성 결과 없음";
  }
  throw new Error("알 수 없는 AI 엔진");
}

/* ── GPT-4o Vision OCR ── */
async function runVisionOCR(imgData,keys){
  const key=keys.openai;
  if(!key)throw new Error("OCR은 OpenAI API 키(GPT-4o Vision)가 필요합니다.");
  const res=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},
    body:JSON.stringify({model:"gpt-4o",max_tokens:1000,messages:[{role:"user",content:[{type:"image_url",image_url:{url:imgData}},{type:"text",text:"이 이미지에 있는 텍스트를 정확하게 추출해 주세요. 수식, 시, 지문이 있다면 그대로 옮겨주세요. 텍스트만 출력하고 다른 설명은 하지 마세요."}]}]})});
  const d=await res.json();if(d.error)throw new Error(d.error.message);
  return d.choices?.[0]?.message?.content||"";
}

  /* ── 활동별 세특 생성 ── */

              const rightContent=rightActIdx!==null?setkPartResult[rightActIdx]||null:setkResult;
              const rightLoading=rightActIdx!==null?!!setkPartGen[rightActIdx]:setkGen;
              return(
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1.4rem",alignItems:"start"}}>
                  <div>
                    <div style={{fontWeight:800,fontSize:"1.3rem",marginBottom:"1.2rem",color:cv.ink}}>🧠 활동 분석 및 세특 작성</div>
                    {/* 헤더: 학생 선택 + AI 엔진 (활용내용명 제거) */}
                    <div style={{...crd(),marginBottom:"1rem"}}>
                      <div style={{marginBottom:".8rem"}}>
                        <div style={{fontSize:".78rem",fontWeight:700,color:cv.ink2,marginBottom:".3rem"}}>학생 선택</div>
                        <select style={inp()} value={setkStu} onChange={e=>onSetkStuChange(e.target.value)}>
                          <option value="">-- 학번 + 이름 선택 --</option>
                          {ROSTER.map(s=><option key={s.id} value={s.id}>{s.id} {s.name}</option>)}
                        </select>
                      </div>
                      <div>
                        <div style={{fontSize:".78rem",fontWeight:700,color:cv.ink2,marginBottom:".4rem"}}>🤖 AI 엔진</div>
                        <div style={{display:"flex",gap:".6rem",flexWrap:"wrap"}}>
                          {AI_ENGINES.map(eng=>(
                            <label key={eng} style={{display:"flex",alignItems:"center",gap:".38rem",cursor:"pointer",padding:".38rem .75rem",borderRadius:8,border:`1.5px solid ${aiEngine===eng?cv.lav:cv.border2}`,background:aiEngine===eng?cv.lavLt:"#fff",fontWeight:aiEngine===eng?700:400,fontSize:".84rem",color:aiEngine===eng?cv.lav:cv.ink2}}>
                              <input type="radio" name="aiEngine" value={eng} checked={aiEngine===eng} onChange={()=>{setAiEngine(eng);ls.set("aiEngine",eng);}} style={{accentColor:cv.lav}}/>{eng}
                            </label>
                          ))}
                        </div>
                      </div>
                    </div>

                    {questions.map((q,ai)=>{
                      const ext=setkExtras[ai]||mkAct();
                      const stuAns=sub?.answers[q.id]?.text||null;
                      return(
                        <div key={q.id} style={{...crd(),marginBottom:"1rem"}}>
                          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:".9rem"}}>
                            <label style={{display:"flex",alignItems:"center",gap:".35rem",cursor:"pointer"}}>
                              <input type="checkbox" checked={ext.selected!==false} onChange={e=>setSetkExtras(p=>{const n=[...p];n[ai]={...n[ai],selected:e.target.checked};return n;})} style={{accentColor:cv.lav,width:15,height:15}}/>
                              <span style={{fontWeight:800,fontSize:".97rem",color:cv.lav}}>활동 {ai+1}</span>
                            </label>
                            <span style={{fontSize:".8rem",color:cv.muted}}>{q.title}</span>
                          </div>
                          {q.question&&<div style={{background:cv.skyLt,border:`1px solid ${cv.skyMd}`,borderRadius:8,padding:".65rem .9rem",fontSize:".84rem",lineHeight:1.75,color:cv.ink2,whiteSpace:"pre-wrap",marginBottom:".75rem"}}>{q.question}{q.subQuestion&&"\n\n"+q.subQuestion}</div>}
                          {setkStu&&<div style={{background:stuAns?"#f2fff8":cv.bg,border:`1px solid ${stuAns?cv.mintMd:cv.border2}`,borderRadius:8,padding:".65rem .9rem",fontSize:".84rem",lineHeight:1.75,color:stuAns?cv.ink2:cv.muted,whiteSpace:"pre-wrap",minHeight:48,marginBottom:".8rem"}}>{stuAns||"(제출된 답변 없음)"}</div>}
                          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:".72rem",marginBottom:".75rem"}}>
                            <CompCheck label="📖 국어 교과 역량" items={KOR_COMP} sel={ext.korComp} onChange={v=>setSetkExtras(p=>{const n=[...p];n[ai]={...n[ai],korComp:v};return n;})}/>
                            <CompCheck label="📊 수학 교과 역량" items={MATH_COMP} sel={ext.mathComp} onChange={v=>setSetkExtras(p=>{const n=[...p];n[ai]={...n[ai],mathComp:v};return n;})}/>
                          </div>
                          {/* 교사 관찰 (교사프롬프트 제거, 관찰란만 유지) */}
                          <div style={{display:"grid",gridTemplateColumns:teacher2.enabled?"1fr 1fr":"1fr",gap:".72rem",marginBottom:".75rem"}}>
                            <div><div style={{fontSize:".74rem",fontWeight:700,color:cv.ink2,marginBottom:".28rem"}}>{t1Label}</div><textarea style={{...inp(),minHeight:60,resize:"vertical",lineHeight:1.65}} value={ext.obs1} onChange={e=>setSetkExtras(p=>{const n=[...p];n[ai]={...n[ai],obs1:e.target.value};return n;})}/></div>
                            {teacher2.enabled&&<div><div style={{fontSize:".74rem",fontWeight:700,color:cv.ink2,marginBottom:".28rem"}}>{t2Label}</div><textarea style={{...inp(),minHeight:60,resize:"vertical",lineHeight:1.65}} value={ext.obs2} onChange={e=>setSetkExtras(p=>{const n=[...p];n[ai]={...n[ai],obs2:e.target.value};return n;})}/></div>}
                          </div>
                          <div style={{display:"flex",alignItems:"center",gap:".65rem",marginBottom:".9rem",padding:".55rem .85rem",background:cv.bg,borderRadius:8,border:`1px solid ${cv.border}`}}>
                            <span style={{fontSize:".8rem",fontWeight:700,color:cv.ink2,whiteSpace:"nowrap"}}>세특 바이트 수:</span>
                            <input type="number" style={{...inp(),width:90,fontSize:".9rem",padding:".32rem .65rem"}} value={ext.bytes} min={100} max={3000} onChange={e=>setSetkExtras(p=>{const n=[...p];n[ai]={...n[ai],bytes:parseInt(e.target.value)||500};return n;})}/>
                            <span style={{fontSize:".78rem",color:cv.muted}}>bytes</span>
                          </div>
                          <div style={{display:"flex",gap:".6rem"}}>
                            <button onClick={()=>{if(setkPartResult[ai]){setSetkExtras(p=>{const n=[...p];n[ai]={...n[ai],savedDraft:setkPartResult[ai]};return n;});alert("저장되었습니다.");}else alert("먼저 세특 초안을 생성해 주세요.")}} style={{...btn(cv.mintLt,cv.mint),border:`1px solid ${cv.mintMd}`,flex:"0 0 auto",fontSize:".84rem",padding:".6rem .9rem"}}>💾 저장하기</button>
                            <button onClick={()=>generateActSetk(ai)} disabled={!!setkPartGen[ai]} style={{...btn(`linear-gradient(135deg,${cv.lav},#9b59b6)`),flex:1,padding:".62rem",fontSize:".86rem",opacity:setkPartGen[ai]?.6:1}}>
                              {setkPartGen[ai]?"⏳ 생성 중...":"✦ 세특 초안 작성하기"}
                            </button>
                          </div>
                          {ext.savedDraft&&<div style={{marginTop:".5rem",fontSize:".73rem",color:cv.mint,fontWeight:700}}>✓ 초안 저장됨 ({ext.savedDraft.length}자)</div>}
                        </div>
                      );
                    })}

                    <div style={{...crd({background:cv.lavLt,border:`1.5px solid ${cv.lavMd}`}),marginBottom:"1rem"}}>
                      <div style={{fontWeight:700,fontSize:".95rem",color:cv.ink,marginBottom:".75rem"}}>📝 선택 활동 전체 세특 종합</div>
                      <div style={{fontSize:".78rem",color:cv.muted,marginBottom:".7rem"}}>
                        선택: {questions.map((_,i)=>setkExtras[i]?.selected!==false?`활동${i+1}`:null).filter(Boolean).join(", ")||"없음"}
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:".65rem",marginBottom:".85rem"}}>
                        <span style={{fontSize:".8rem",fontWeight:700,color:cv.ink2,whiteSpace:"nowrap"}}>글자수 제한:</span>
                        <input type="number" style={{...inp(),width:90,fontSize:".9rem",padding:".32rem .65rem"}} value={charLimit} min={100} max={2000} onChange={e=>setCharLimit(parseInt(e.target.value)||500)}/>
                        <span style={{fontSize:".78rem",color:cv.muted}}>자</span>
                      </div>
                      <button onClick={generateAllSetk} disabled={setkGen} style={{...btn(`linear-gradient(135deg,${cv.lav},${cv.mint})`),width:"100%",padding:".92rem",fontSize:".97rem",borderRadius:10,opacity:setkGen?.6:1}}>
                        {setkGen?"⏳ 전체 생성 중...":`✦ 선택 활동 세특 종합 생성 ✦`}
                      </button>
                    </div>
                  </div>

                  {/* 우측 패널 */}
                  <div style={{position:"sticky",top:"1.5rem"}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:".85rem",flexWrap:"wrap",gap:".4rem"}}>
                      <div style={{fontWeight:700,fontSize:"1rem",color:cv.ink}}>📄 {rightTitle}</div>
                      <div style={{display:"flex",gap:".3rem",flexWrap:"wrap"}}>
                        <button onClick={()=>setRightActIdx(null)} style={{...btn(rightActIdx===null?cv.lav:cv.bg,rightActIdx===null?"#fff":cv.muted),border:`1px solid ${rightActIdx===null?cv.lav:cv.border2}`,borderRadius:20,fontSize:".73rem",padding:".2rem .62rem"}}>전체</button>
                        {questions.map((_,i)=>(<button key={i} onClick={()=>setRightActIdx(i)} style={{...btn(rightActIdx===i?cv.lav:cv.bg,rightActIdx===i?"#fff":cv.muted),border:`1px solid ${rightActIdx===i?cv.lav:cv.border2}`,borderRadius:20,fontSize:".73rem",padding:".2rem .62rem"}}>활동{i+1}</button>))}
                      </div>
                    </div>
                    {rightLoading
                      ?<div style={{...crd(),textAlign:"center",padding:"3.5rem"}}><div style={{width:42,height:42,border:`3px solid ${cv.border}`,borderTopColor:cv.lav,borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 1rem"}}/><div style={{color:cv.muted}}>생성 중...</div></div>
                      :rightContent
                        ?<div style={{...crd(),position:"relative"}}>
                            <div style={{position:"absolute",top:-12,left:"1.2rem",background:cv.lavMd,padding:".1rem .58rem",fontSize:".69rem",fontWeight:700,color:cv.ink,letterSpacing:".1em",borderRadius:20}}>세부능력 및 특기사항</div>
                            <p style={{fontSize:".93rem",lineHeight:2.05,color:cv.ink,whiteSpace:"pre-wrap",wordBreak:"keep-all",marginTop:".4rem"}}>{rightContent}</p>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:".9rem",paddingTop:".75rem",borderTop:`1px solid ${cv.border}`,flexWrap:"wrap",gap:".5rem"}}>
                              <span style={{fontSize:".76rem",color:cv.muted}}>{rightContent.length}자</span>
                              <button onClick={()=>navigator.clipboard.writeText(rightContent).then(()=>alert("복사!")).catch(()=>{})} style={{...btn(`linear-gradient(135deg,${cv.mint},#27ae60)`),padding:".45rem 1rem",fontSize:".83rem"}}>📋 복사</button>
                            </div>
                          </div>
                        :<div style={{...crd({border:`1.5px dashed ${cv.border2}`}),textAlign:"center",padding:"4rem 1.5rem",color:cv.muted,fontSize:".9rem"}}>
                            <div style={{fontSize:"2.8rem",marginBottom:".9rem"}}>📝</div>
                            활동별 초안 또는 전체 세특을<br/>생성하면 여기에 표시됩니다
                          </div>
                    }
                  </div>
                </div>
              );
            })()}

            {/* ══ 학생별 세특 대시보드 — 가로 테이블 뷰 (PDF 2.2 스펙) ══ */}
            {tab==="setkdash"&&(()=>{
              /* 셀 직접 편집 핸들러 */
              const updateCell=(sid,key,val)=>{
                setSetkStore(prev=>{
                  const n={...prev,[sid]:{...(prev[sid]||{}),[key]:val}};
                  ls.set("setkStore",n);return n;
                });
              };
              /* 셀 상태 뱃지 */
              const cellBadge=(txt)=>{
                if(!txt)return{label:"미입력",bg:cv.bg,col:cv.muted,bc:cv.border2};
                if(txt.length<10)return{label:"입력중",bg:cv.peachLt,col:cv.peachDk,bc:cv.peachMd};
                return{label:"완료",bg:cv.mintLt,col:cv.mint,bc:cv.mintMd};
              };

              return(
                <div>
                  {/* 상단 타이틀 + 버튼 */}
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"1.3rem",flexWrap:"wrap",gap:".7rem"}}>
                    <div>
                      <div style={{fontWeight:800,fontSize:"1.3rem",color:cv.ink}}>📊 학생별 세특 통합 관리</div>
                      <div style={{fontSize:".82rem",color:cv.muted,marginTop:".2rem"}}>세특 작성 탭에서 생성된 내용이 자동 반영됩니다 · 셀을 클릭하면 직접 편집 가능</div>
                    </div>
                    <div style={{display:"flex",gap:".55rem"}}>
                      <button onClick={()=>{ls.set("setkStore",setkStore);alert("저장되었습니다.");}} style={{...btn(`linear-gradient(135deg,${cv.lav},#9b59b6)`),fontSize:".86rem",padding:".55rem 1.1rem"}}>💾 저장하기</button>
                      <button onClick={exportSetkDashExcel} style={{...btn("linear-gradient(135deg,#1e7e34,#27ae60)"),fontSize:".86rem",padding:".55rem 1.1rem"}}>📊 엑셀 내보내기</button>
                    </div>
                  </div>

                  {/* 요약 배지 */}
                  <div style={{display:"flex",gap:".45rem",flexWrap:"wrap",marginBottom:"1.1rem"}}>
                    {[
                      [`전체 ${ROSTER.length}명`,"#f0f4ff",cv.ink2,cv.border2],
                      [`최종완료 ${ROSTER.filter(s=>(setkStore[s.id]||{}).final).length}명`,cv.mintLt,cv.mint,cv.mintMd],
                      [`활동완료 ${ROSTER.filter(s=>questions.every(q=>(setkStore[s.id]||{})[q.id])).length}명`,cv.lavLt,cv.lav,cv.lavMd],
                      [`미생성 ${ROSTER.filter(s=>!questions.some(q=>(setkStore[s.id]||{})[q.id])&&!(setkStore[s.id]||{}).final).length}명`,cv.roseLt,cv.rose,cv.roseMd],
                    ].map(([label,bg,col,bc])=><span key={label} style={pill(bg,col,bc)}>{label}</span>)}
                  </div>

                  {/* 메인 가로 테이블 */}
                  <div style={{overflowX:"auto",borderRadius:13,border:`1.5px solid ${cv.border}`,boxShadow:"0 2px 14px rgba(124,92,191,.09)"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:".83rem",minWidth:900}}>
                      <thead>
                        <tr style={{background:"linear-gradient(90deg,#e8e0ff,#d4f5e8)"}}>
                          <th style={{padding:".7rem 1rem",textAlign:"left",borderBottom:`2px solid ${cv.border}`,fontWeight:700,color:cv.ink2,width:90,position:"sticky",left:0,background:"linear-gradient(90deg,#e8e0ff,#ddd6ff)",zIndex:2}}>학생</th>
                          {questions.map((q,i)=>(
                            <th key={i} style={{padding:".7rem .6rem",textAlign:"left",borderBottom:`2px solid ${cv.border}`,fontWeight:700,color:cv.ink2,minWidth:180}}>
                              <div>활동 {i+1}</div>
                              <div style={{fontSize:".72rem",color:cv.muted,fontWeight:400,marginTop:".1rem"}}>{q.title}</div>
                            </th>
                          ))}
                          <th style={{padding:".7rem .6rem",textAlign:"left",borderBottom:`2px solid ${cv.border}`,fontWeight:800,color:cv.mint,minWidth:200,background:"#e8fff4"}}>
                            <div>최종 종합 세특</div>
                            <div style={{fontSize:".72rem",color:cv.muted,fontWeight:400,marginTop:".1rem"}}>NEIS 업로드용</div>
                          </th>
                        </tr>
                      </thead>
                      <tbody>
                        {ROSTER.map((s,ri)=>{
                          const store=setkStore[s.id]||{};
                          const isHL=setkDashStu===s.id;
                          return(
                            <tr key={s.id} style={{background:isHL?cv.lavLt:ri%2===0?"#fff":"#fafbff",transition:"background .12s"}}>
                              {/* 학생명 고정 열 */}
                              <td style={{padding:".55rem 1rem",borderBottom:`1px solid ${cv.border}`,position:"sticky",left:0,background:isHL?cv.lavLt:ri%2===0?"#fff":"#fafbff",zIndex:1}}>
                                <div style={{fontWeight:800,fontSize:".88rem",color:isHL?cv.lav:cv.ink,cursor:"pointer"}} onClick={()=>setSetkDashStu(s.id)}>{s.name}</div>
                                <div style={{fontSize:".72rem",color:cv.muted}}>{s.id}</div>
                              </td>
                              {/* 활동별 세특 셀 */}
                              {questions.map(q=>{
                                const txt=store[q.id]||"";
                                const {label,bg,col,bc}=cellBadge(txt);
                                return(
                                  <td key={q.id} style={{padding:".45rem .6rem",borderBottom:`1px solid ${cv.border}`,verticalAlign:"top"}}>
                                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:".3rem"}}>
                                      <span style={pill(bg,col,bc)}>{label}</span>
                                      {txt&&<span style={{fontSize:".68rem",color:cv.muted}}>{txt.length}자</span>}
                                    </div>
                                    <textarea
                                      value={txt}
                                      onChange={e=>updateCell(s.id,q.id,e.target.value)}
                                      placeholder="미생성 — 세특 작성 탭에서 생성하거나 직접 입력"
                                      style={{...inp({fontSize:".8rem",minHeight:72,resize:"vertical",lineHeight:1.7,padding:".45rem .6rem",background:txt?"#fff":"#f8f9fc",color:txt?cv.ink:cv.muted})}}
                                    />
                                  </td>
                                );
                              })}
                              {/* 최종 세특 셀 */}
                              {(()=>{
                                const txt=store.final||"";
                                const {label,bg,col,bc}=cellBadge(txt);
                                return(
                                  <td style={{padding:".45rem .6rem",borderBottom:`1px solid ${cv.border}`,verticalAlign:"top",background:isHL?"#edfff6":ri%2===0?"#f5fffa":"#efffF5"}}>
                                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:".3rem"}}>
                                      <span style={pill(txt?cv.mintLt:cv.bg,txt?cv.mint:cv.muted,txt?cv.mintMd:cv.border2)}>{label}</span>

                                    </div>
                                    <textarea
                                      value={txt}
                                      onChange={e=>updateCell(s.id,"final",e.target.value)}
                                      placeholder="미생성 — 세특 작성 탭에서 종합 생성하거나 직접 입력"
                                      style={{...inp({fontSize:".8rem",minHeight:72,resize:"vertical",lineHeight:1.7,padding:".45rem .6rem",background:txt?"#fff":"#f8f9fc",color:txt?cv.ink:cv.muted})}}
                                    />
                                    {txt&&(
                                      <button onClick={()=>navigator.clipboard.writeText(txt).then(()=>alert(`${s.name} 최종 세특 복사!`)).catch(()=>{})}
                                        style={{...btn(`linear-gradient(135deg,${cv.mint},#27ae60)`),fontSize:".72rem",padding:".22rem .65rem",marginTop:".3rem"}}>📋 복사</button>
                                    )}
                                  </td>
                                );
                              })()}
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                  <div style={{marginTop:".75rem",fontSize:".76rem",color:cv.muted}}>💡 각 셀을 직접 클릭하여 편집할 수 있습니다 · 편집 후 반드시 [저장하기]를 눌러주세요</div>
                </div>
              );
            })()}

            {/* ══ 환경설정 ══ */}
            {tab==="settings"&&(
              <>
                <div style={{fontWeight:800,fontSize:"1.3rem",marginBottom:"1.4rem",color:cv.ink}}>⚙️ 환경설정</div>
                <div style={{...crd(),marginBottom:"1rem"}}>
                  <div style={{fontWeight:700,marginBottom:"1rem",fontSize:".97rem"}}>👨‍🏫 교사 프로필</div>
                  <div style={{fontSize:".8rem",color:cv.muted,marginBottom:".9rem",lineHeight:1.6,background:cv.lavLt,padding:".65rem .9rem",borderRadius:8,border:`1px solid ${cv.lavMd}`}}>
                    설정된 교사 이름은 세특 작성 화면에 <strong>[홍길동 교사(확률과 통계)의 관찰]</strong> 형태로 자동 표시됩니다.
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:".8rem",marginBottom:"1rem"}}>
                    <div><div style={{fontSize:".8rem",fontWeight:700,color:cv.ink2,marginBottom:".3rem"}}>교사 1 성명</div><input style={inp()} placeholder="홍길동" value={teacher1.name} onChange={e=>{const n={...teacher1,name:e.target.value};setTeacher1(n);ls.set("teacher1",n);}}/></div>
                    <div><div style={{fontSize:".8rem",fontWeight:700,color:cv.ink2,marginBottom:".3rem"}}>교사 1 담당 과목</div><input style={inp()} placeholder="확률과 통계" value={teacher1.subject} onChange={e=>{const n={...teacher1,subject:e.target.value};setTeacher1(n);ls.set("teacher1",n);}}/></div>
                  </div>
                  <div style={{padding:".75rem .9rem",background:cv.bg,borderRadius:9,border:`1px solid ${cv.border}`,marginBottom:".9rem"}}>
                    <label style={{display:"flex",alignItems:"center",gap:".55rem",cursor:"pointer",fontWeight:700,fontSize:".9rem",color:cv.ink2}}>
                      <input type="checkbox" checked={teacher2.enabled} onChange={e=>{const n={...teacher2,enabled:e.target.checked};setTeacher2(n);ls.set("teacher2",n);}} style={{accentColor:cv.lav,width:16,height:16}}/>
                      교사 2 (코티칭 협력 교사) 활성화
                    </label>
                  </div>
                  {teacher2.enabled&&(
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:".8rem"}}>
                      <div><div style={{fontSize:".8rem",fontWeight:700,color:cv.ink2,marginBottom:".3rem"}}>교사 2 성명</div><input style={inp()} placeholder="이영희" value={teacher2.name} onChange={e=>{const n={...teacher2,name:e.target.value};setTeacher2(n);ls.set("teacher2",n);}}/></div>
                      <div><div style={{fontSize:".8rem",fontWeight:700,color:cv.ink2,marginBottom:".3rem"}}>교사 2 담당 과목</div><input style={inp()} placeholder="화법과 작문" value={teacher2.subject} onChange={e=>{const n={...teacher2,subject:e.target.value};setTeacher2(n);ls.set("teacher2",n);}}/></div>
                    </div>
                  )}
                </div>

                <div style={{...crd(),marginBottom:"1rem"}}>
                  <div style={{fontWeight:700,marginBottom:".4rem",fontSize:".97rem"}}>📋 활동별 전역 AI 지시문 (2.3)</div>
                  <div style={{fontSize:".8rem",color:cv.muted,marginBottom:".9rem",lineHeight:1.6,background:"#fffdf0",padding:".65rem .9rem",borderRadius:8,border:`1px solid ${cv.peachMd}`}}>
                    각 활동별 AI 페르소나, 서술어 어미 제한 등 전역 지시사항을 사전 설정합니다. 학생 화면에는 노출되지 않으며 세특 생성 시 자동으로 프롬프트에 삽입됩니다.
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:".8rem"}}>
                    {questions.map((q,i)=>(
                      <div key={q.id}>
                        <div style={{fontSize:".8rem",fontWeight:700,color:cv.ink2,marginBottom:".3rem"}}>Q{i+1} — {q.title} <span style={{color:cv.muted,fontWeight:400}}>({q.subject})</span></div>
                        <textarea style={{...inp(),minHeight:72,resize:"vertical",lineHeight:1.7,background:"#fffdf0",border:`1.5px solid ${cv.peachMd}`}}
                          placeholder="페르소나, 어미, 강조 항목 등 전역 지시사항..."
                          value={(globalPrompts[i]||{}).text||""}
                          onChange={e=>{
                            const n=questions.map((_,j)=>({id:questions[j].id,text:j===i?e.target.value:(globalPrompts[j]||{}).text||""}));
                            setGlobalPrompts(n);ls.set("globalPrompts",n);
                          }}
                        />
                      </div>
                    ))}
                  </div>
                </div>

                <div style={{...crd(),marginBottom:"1rem"}}>
                  <div style={{fontWeight:700,marginBottom:"1rem",fontSize:".97rem"}}>🤖 AI 엔진별 API Key</div>
                  <div style={{fontSize:".78rem",color:cv.muted,marginBottom:"1rem",lineHeight:1.6,background:cv.lavLt,padding:".7rem .9rem",borderRadius:8,border:`1px solid ${cv.lavMd}`}}>
                    <strong>Claude:</strong> x-api-key 헤더 &nbsp;|&nbsp; <strong>Gemini:</strong> URL ?key= &nbsp;|&nbsp; <strong>ChatGPT + OCR:</strong> GPT-4o Vision (OpenAI 키 공용)
                  </div>
                  {[["Claude","claude","sk-ant-..."],["Gemini","gemini","AIza..."],["ChatGPT + OCR","openai","sk-..."]].map(([label,field,ph])=>(
                    <div key={field} style={{marginBottom:".9rem"}}>
                      <div style={{fontSize:".8rem",fontWeight:700,color:cv.ink2,marginBottom:".3rem"}}>{label} API Key</div>
                      <input type="password" style={inp()} placeholder={ph} value={apiKeys[field]||""} onChange={e=>{const n={...apiKeys,[field]:e.target.value};setApiKeys(n);ls.set("apiKeys",n);}}/>
                    </div>
                  ))}
                  <div style={{marginTop:".5rem"}}>
                    <div style={{fontSize:".8rem",fontWeight:700,color:cv.ink2,marginBottom:".4rem"}}>현재 AI 엔진</div>
                    <div style={{display:"flex",gap:".6rem"}}>
                      {AI_ENGINES.map(eng=>(
                        <label key={eng} style={{display:"flex",alignItems:"center",gap:".38rem",cursor:"pointer",padding:".38rem .75rem",borderRadius:8,border:`1.5px solid ${aiEngine===eng?cv.lav:cv.border2}`,background:aiEngine===eng?cv.lavLt:"#fff",fontWeight:aiEngine===eng?700:400,fontSize:".84rem",color:aiEngine===eng?cv.lav:cv.ink2}}>
                          <input type="radio" name="aiEngineSettings" value={eng} checked={aiEngine===eng} onChange={()=>{setAiEngine(eng);ls.set("aiEngine",eng);}} style={{accentColor:cv.lav}}/>{eng}
                        </label>
                      ))}
                    </div>
                  </div>
                </div>

                <div style={{...crd(),marginBottom:"1rem"}}>
                  <div style={{fontWeight:700,marginBottom:"1rem",fontSize:".97rem"}}>🔒 교사 비밀번호 변경</div>
                  <div style={{display:"flex",gap:".75rem",alignItems:"flex-end"}}>
                    <div style={{flex:1}}><div style={{fontSize:".78rem",fontWeight:700,color:cv.ink2,marginBottom:".3rem"}}>새 비밀번호 (숫자)</div><input type="password" style={inp()} placeholder="숫자만 입력" value={newPw} onChange={e=>setNewPw(e.target.value.replace(/\D/g,"").slice(0,8))}/></div>
                    <button onClick={()=>{if(newPw.length<2){alert("최소 2자리");return;}setTeacherPw(newPw);ls.set("pw",newPw);setNewPw("");alert(`비밀번호가 "${newPw}"로 변경되었습니다.`);}} style={btn(`linear-gradient(135deg,${cv.lav},#9b59b6)`)}>변경</button>
                  </div>
                  <div style={{fontSize:".76rem",color:cv.muted,marginTop:".3rem"}}>현재: {teacherPw}</div>
                </div>
                <div style={{display:"flex",gap:".9rem",flexWrap:"wrap"}}>
                  <button onClick={()=>{if(window.confirm("제출 데이터를 전부 삭제하시겠습니까?"))setSubmissions([]);}} style={{...btn(cv.roseLt,cv.rose),border:`1px solid ${cv.roseMd}`}}>제출 데이터 전체 삭제</button>
                  <button onClick={()=>{if(window.confirm("문항을 기본값으로 복원하시겠습니까?"))setQuestions(DEF_Q);}} style={{...btn(cv.roseLt,cv.rose),border:`1px solid ${cv.roseMd}`}}>문항 기본값 복원</button>
                </div>
              </>
            )}
          </main>
        </div>
      </div>
    );
  }

  /* ════════════════ WORKSHEET ════════════════ */
  if(page==="worksheet"){
    const q=questions[curQ];if(!q)return null;
    const ans=answers[q.id]||{text:"",imgData:null,imgText:"",poemSel:""};
    const cnt=(ans.text||"").length;
    const updAns=(f,v)=>setAnswers(p=>({...p,[q.id]:{...(p[q.id]||{}),[f]:v}}));
    const hasPoemImages=(q.poemImages||[]).length>0;
    const selPoem=(q.poemImages||[]).find(p=>p.label===ans.poemSel);
    const qid=q.id;
    const needsSave=ocrDone[qid]&&!ocrSaved[qid];
    const isLast=curQ===questions.length-1;
    return(
      <div style={{background:cv.bg,minHeight:"100vh"}}>
        {generating&&<Spinner prog={genProg}/>}
        <NavBar name={stuName} sub={`학번 ${stuId}`}/>
        <div style={{maxWidth:820,margin:"0 auto",padding:"1.8rem 1.2rem 4rem"}}>
          <div style={{textAlign:"center",padding:"1.8rem 1rem 1.6rem",marginBottom:"1.6rem",borderBottom:`2px solid ${cv.border}`}}>
            <div style={{fontSize:".74rem",letterSpacing:".22em",color:cv.muted,marginBottom:".35rem"}}>고등학교 교과 융합 활동지</div>
            <h1 style={{fontWeight:900,fontSize:"1.65rem",color:cv.ink,marginBottom:".45rem"}}>화법과 작문 × 확률과 통계</h1>
            <div style={{display:"flex",gap:".5rem",justifyContent:"center",marginBottom:".75rem"}}>
              <span style={pill(cv.lavLt,cv.lav,cv.lavMd)}>📖 화법과 작문</span>
              <span style={pill(cv.mintLt,cv.mint,cv.mintMd)}>📊 확률과 통계</span>
            </div>
            <div style={{display:"inline-flex",gap:"1.5rem",border:`1.5px solid ${cv.border}`,padding:".5rem 1.4rem",borderRadius:22,fontSize:".88rem",background:"#fff"}}>
              <span><span style={{color:cv.muted,fontSize:".78rem"}}>이름 </span>{stuName}</span>
              <span><span style={{color:cv.muted,fontSize:".78rem"}}>학번 </span>{stuId}</span>
            </div>
          </div>
          <div style={{marginBottom:"1.5rem"}}>
            <div style={{textAlign:"center",fontSize:".84rem",color:cv.muted,background:"#fff",border:`1.5px solid ${cv.border}`,borderRadius:22,padding:".5rem 1.1rem",marginBottom:".55rem"}}>
              <strong style={{color:cv.ink}}>{doneCount}/{questions.length}</strong>개 활동 완료{doneCount===questions.length&&<span style={{color:cv.mint,fontWeight:700}}> ✓ 모두 완료!</span>}
            </div>
            <div style={{height:7,background:cv.border,borderRadius:999,overflow:"hidden"}}><div style={{height:"100%",width:((doneCount/Math.max(questions.length,1))*100)+"%",background:`linear-gradient(90deg,${cv.lavMd},${cv.mintMd})`,transition:"width .4s"}}/></div>
          </div>
          <div style={{display:"flex",gap:".45rem",flexWrap:"wrap",marginBottom:"1.3rem"}}>
            {questions.map((qq,i)=>{const done=(answers[qq.id]?.text||"").trim().length>=20,active=curQ===i;return<button key={qq.id} onClick={()=>setCurQ(i)} style={{padding:".38rem .88rem",fontSize:".79rem",border:`1.5px solid ${active?cv.lav:done?cv.mint:cv.border2}`,background:active?cv.lav:done?cv.mintLt:"#fff",color:active?"#fff":done?cv.mint:cv.muted,borderRadius:22,cursor:"pointer",fontWeight:700}}>{i+1}. {qq.title}{done?" ✓":""}</button>;})}
          </div>
          <div style={{...crd(),marginBottom:"1.1rem",animation:"fadeUp .25s ease"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:".6rem"}}>
              <span style={{fontWeight:900,fontSize:"2rem",color:cv.border2,lineHeight:1}}>0{curQ+1}</span>
              <span style={pill(cv.lavLt,cv.lav,cv.lavMd)}>{q.subject}</span>
            </div>
            <div style={{fontWeight:800,fontSize:"1.08rem",color:cv.ink,marginBottom:".55rem"}}>{q.title}</div>
            {q.rubric.length>0&&<div style={{display:"flex",gap:".35rem",flexWrap:"wrap",marginBottom:".9rem"}}>{q.rubric.map(r=><span key={r} style={pill(cv.peachLt,cv.peachDk,cv.peachMd)}>◆ {r}</span>)}</div>}

            {/* 분석 설정 영역 */}
            <div style={{background:cv.skyLt,border:`1.5px solid ${cv.skyMd}`,borderRadius:10,padding:".85rem 1rem",marginBottom:"1rem"}}>
              <div style={{fontWeight:800,fontSize:".88rem",color:"#1a5f8a",marginBottom:".7rem"}}>📋 분석 설정</div>
              <div style={{display:"flex",gap:"1rem",flexWrap:"wrap",marginBottom:".6rem"}}>
                <label style={{display:"flex",alignItems:"center",gap:".38rem",cursor:"pointer",fontSize:".87rem",fontWeight:600,color:cv.ink2}}>
                  <input type="checkbox" checked={showMath} onChange={e=>setShowMath(e.target.checked)} style={{accentColor:cv.lav,width:15,height:15}}/> 수학 개념
                </label>
                {hasPoemImages&&(
                  <label style={{display:"flex",alignItems:"center",gap:".38rem",cursor:"pointer",fontSize:".87rem",fontWeight:600,color:cv.ink2}}>
                    <input type="checkbox" checked={showPoem} onChange={e=>setShowPoem(e.target.checked)} style={{accentColor:cv.lav,width:15,height:15}}/> 분석할 시
                  </label>
                )}
                <label style={{display:"flex",alignItems:"center",gap:".38rem",cursor:"pointer",fontSize:".87rem",fontWeight:600,color:cv.ink2}}>
                  <input type="checkbox" checked={showNonFic} onChange={e=>setShowNonFic(e.target.checked)} style={{accentColor:cv.lav,width:15,height:15}}/> 비문학 지문
                </label>
              </div>
              {showMath&&(
                <div style={{marginBottom:".6rem"}}>
                  <div style={{fontWeight:800,fontSize:".82rem",color:"#1a5f8a",marginBottom:".28rem"}}>수학 개념 메모</div>
                  <input style={{...inp(),fontSize:".88rem",background:"#fff"}} placeholder="예) 조건부 확률, 베이즈 정리..." value={ans.mathConcept||""} onChange={e=>updAns("mathConcept",e.target.value)}/>
                </div>
              )}
              {showPoem&&hasPoemImages&&(
                <div style={{marginBottom:".6rem"}}>
                  <div style={{fontWeight:800,fontSize:".82rem",color:"#1a5f8a",marginBottom:".28rem"}}>분석할 시/지문 선택</div>
                  <select style={inp()} value={ans.poemSel||""} onChange={e=>updAns("poemSel",e.target.value)}>
                    <option value="">-- 시/지문을 선택하세요 --</option>
                    {(q.poemImages||[]).map((pi,i)=><option key={i} value={pi.label}>{pi.label}</option>)}
                  </select>
                  {selPoem&&(
                    <div style={{marginTop:".65rem"}}>
                      <img src={selPoem.dataUrl} alt={selPoem.label} style={{maxWidth:"100%",borderRadius:9,border:`1.5px solid ${cv.border}`,display:"block",maxHeight:400,objectFit:"contain",background:"#f8f9fc"}}/>
                      <div style={{display:"flex",gap:".6rem",marginTop:".6rem",alignItems:"center"}}>
                        <span style={{fontSize:".78rem",color:cv.muted}}>{selPoem.label}</span>
                        <button onClick={()=>runOCR(curQ,selPoem.dataUrl)} disabled={!!ocrLoading[qid]} style={{...btn(`linear-gradient(135deg,${cv.lav},#9b59b6)`),fontSize:".78rem",padding:".35rem .85rem",marginLeft:"auto",opacity:ocrLoading[qid]?.6:1}}>
                          {ocrLoading[qid]?"⏳ 읽는 중...":"🔍 AI 이미지 읽기 (GPT-4o)"}
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}
              {showNonFic&&(
                <div>
                  <div style={{fontWeight:800,fontSize:".82rem",color:"#1a5f8a",marginBottom:".28rem"}}>비문학 지문 메모</div>
                  <textarea style={{...inp(),minHeight:70,resize:"vertical",lineHeight:1.75,background:"#fff",fontSize:".88rem"}} placeholder="비문학 지문의 핵심 내용을 간략히 적어두세요..." value={ans.nonFic||""} onChange={e=>updAns("nonFic",e.target.value)}/>
                </div>
              )}
            </div>

            {/* 탐구 안내 — Bold */}
            <div style={{fontSize:".9rem",lineHeight:1.9,color:cv.ink2,whiteSpace:"pre-line",background:"#fffbf0",borderLeft:`3px solid ${cv.peachMd}`,padding:".9rem 1.1rem",borderRadius:"0 9px 9px 0",marginBottom:".75rem"}}>
              <div style={{fontWeight:800,fontSize:".84rem",color:cv.peachDk,marginBottom:".35rem"}}>📌 탐구 안내</div>
              <div style={{fontWeight:700}}>{q.question}</div>
              {q.subQuestion&&<div style={{fontWeight:700,marginTop:".55rem",whiteSpace:"pre-line"}}>{q.subQuestion}</div>}
            </div>

            <div style={{fontSize:".79rem",fontWeight:700,color:cv.ink2,marginBottom:".35rem"}}>✏️ 활동 답변 작성</div>
            <textarea style={{...inp(),minHeight:140,resize:"vertical",lineHeight:1.9,background:"#fafcff"}} placeholder={q.placeholder||"답변을 입력하세요..."} value={ans.text} maxLength={q.maxLen} onChange={e=>updAns("text",e.target.value)}/>
            <div style={{textAlign:"right",fontSize:".76rem",color:cnt>q.maxLen*.9?cv.rose:cv.muted,marginTop:".25rem",fontWeight:cnt>q.maxLen*.9?700:400}}>{cnt} / {q.maxLen}자</div>

            <div style={{marginTop:"1.1rem"}}>
              <div style={{fontSize:".79rem",fontWeight:700,color:cv.ink2,marginBottom:".35rem"}}>📸 활동지 사진 업로드 <span style={{color:cv.muted,fontWeight:400}}>(선택)</span></div>
              <StuImgUpload value={ans.imgData} onChange={v=>{updAns("imgData",v);if(!v){setOcrDone(p=>({...p,[qid]:false}));setOcrSaved(p=>({...p,[qid]:false}));}}}/>
            </div>
            {ans.imgData&&(
              <div style={{marginTop:"1rem"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:".35rem"}}>
                  <div style={{fontSize:".79rem",fontWeight:700,color:cv.ink2}}>📝 이미지 내용 텍스트 변환</div>
                  <button onClick={()=>runOCR(curQ,ans.imgData)} disabled={!!ocrLoading[qid]} style={{...btn(`linear-gradient(135deg,${cv.lav},#9b59b6)`),fontSize:".76rem",padding:".3rem .8rem",opacity:ocrLoading[qid]?.6:1}}>
                    {ocrLoading[qid]?"⏳ 읽는 중...":"🔍 AI 이미지 읽기 (GPT-4o)"}
                  </button>
                </div>
                <textarea style={{...inp(),minHeight:95,resize:"vertical",lineHeight:1.8,background:"#fafcff"}} placeholder="업로드한 이미지의 내용을 텍스트로 작성하세요..." value={ans.imgText} onChange={e=>updAns("imgText",e.target.value)}/>
                {ocrDone[qid]&&(
                  <div style={{marginTop:".65rem",padding:".75rem 1rem",background:ocrSaved[qid]?cv.mintLt:cv.peachLt,border:`1.5px solid ${ocrSaved[qid]?cv.mintMd:cv.peachMd}`,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"space-between",gap:"1rem"}}>
                    <span style={{fontSize:".84rem",fontWeight:700,color:ocrSaved[qid]?cv.mint:cv.peachDk}}>
                      {ocrSaved[qid]?"✅ 저장 완료. 다음 문항으로 이동할 수 있습니다.":"⚠️ AI 읽기 완료. 내용 확인 후 [저장하기]를 눌러주세요."}
                    </span>
                    {!ocrSaved[qid]&&<button onClick={()=>setOcrSaved(p=>({...p,[qid]:true}))} style={{...btn(`linear-gradient(135deg,${cv.mint},#27ae60)`),padding:".5rem 1.1rem",fontSize:".86rem",flexShrink:0}}>💾 저장하기</button>}
                  </div>
                )}
              </div>
            )}
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:"1.3rem",borderTop:`1.5px solid ${cv.border}`}}>
            <button disabled={curQ===0} onClick={()=>setCurQ(p=>p-1)} style={{...btn("#fff",cv.ink2),border:`1.5px solid ${cv.border2}`,borderRadius:22,padding:".54rem 1.2rem",opacity:curQ===0?.35:1}}>← 이전</button>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:".35rem"}}>
              {needsSave&&<span style={{fontSize:".75rem",color:cv.peachDk,fontWeight:700}}>⚠️ OCR 완료 후 저장이 필요합니다</span>}
              {!isLast
                ?<button onClick={()=>setCurQ(p=>p+1)} disabled={needsSave} style={{...btn("#fff",cv.ink2),border:`1.5px solid ${cv.border2}`,borderRadius:22,padding:".54rem 1.2rem",opacity:needsSave?.35:1}}>다음 →</button>
                :<button onClick={submitWS} disabled={needsSave} style={{...btn("linear-gradient(135deg,#c05c1a,#e67e22)"),borderRadius:22,padding:".56rem 1.6rem",fontSize:".95rem",opacity:needsSave?.35:1}}>활동지 제출하기 →</button>
              }
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* ════════════════ REVIEW ════════════════ */
  if(page==="review"&&submitted)return(
    <div style={{background:cv.bg,minHeight:"100vh"}}>
      {generating&&<Spinner prog={genProg}/>}
      <NavBar name={submitted.stuName} sub={submitted.at}/>
      <div style={{maxWidth:820,margin:"0 auto",padding:"1.8rem 1.2rem 4rem"}}>
        <div style={{textAlign:"center",marginBottom:"1.9rem"}}><h1 style={{fontWeight:800,fontSize:"1.55rem",color:cv.ink,marginBottom:".35rem"}}>활동지 제출 완료 🎉</h1><p style={{fontSize:".88rem",color:cv.muted}}>AI 교세특 생성을 진행하거나 처음으로 돌아갈 수 있습니다</p></div>
        <div style={{display:"flex",flexDirection:"column",gap:".9rem",marginBottom:"1.6rem"}}>
          {questions.map(q=>{const ans=submitted.answers[q.id]||{};return(
            <div key={q.id} style={crd()}>
              <div style={{background:`linear-gradient(90deg,${cv.lavMd},${cv.mintMd})`,padding:".62rem 1.1rem",margin:"-1.3rem -1.3rem 1rem",display:"flex",justifyContent:"space-between",borderRadius:"11px 11px 0 0"}}>
                <strong style={{fontSize:".95rem",color:cv.ink}}>{q.title}</strong><span style={{fontSize:".76rem",color:cv.ink2}}>{q.subject}</span>
              </div>
              <div style={{fontSize:".9rem",lineHeight:1.9,whiteSpace:"pre-wrap",color:cv.ink2,marginBottom:ans.imgData?".9rem":0}}>{ans.text||"(미작성)"}</div>
              {ans.imgData&&<div style={{borderRadius:9,overflow:"hidden",border:`1px solid ${cv.border}`}}><img src={ans.imgData} alt="" style={{width:"100%",maxHeight:210,objectFit:"contain",background:"#f8f9fc",display:"block"}}/></div>}
            </div>
          );})}
        </div>
        <div style={{...crd(),marginBottom:"1.4rem"}}>
          <div style={{fontWeight:700,fontSize:".95rem",color:cv.ink2,marginBottom:".65rem"}}>📝 교사 추가 관찰 사항 <span style={{fontWeight:400,fontSize:".82rem",color:cv.muted}}>(선택)</span></div>
          <textarea style={{...inp(),height:82,resize:"vertical",background:"#fafcff",lineHeight:1.75}} placeholder="예) 수업 중 적극적으로 발표하였으며..." value={tNote} onChange={e=>setTNote(e.target.value)}/>
        </div>
        <button onClick={generate} disabled={generating} style={{...btn(`linear-gradient(135deg,${cv.lav},${cv.mint})`),width:"100%",padding:".95rem",fontSize:"1rem",borderRadius:11,boxShadow:"0 4px 16px rgba(124,92,191,.22)",opacity:generating?.6:1}}>✦ AI 교세특 자동 생성하기 ✦</button>
      </div>
    </div>
  );

  /* ════════════════ RESULT ════════════════ */
  if(page==="result"&&seteuk&&submitted)return(
    <div style={{background:cv.bg,minHeight:"100vh"}}>
      <NavBar/>
      <div style={{maxWidth:720,margin:"0 auto",padding:"2.2rem 1.2rem 4rem"}}>
        <div style={{textAlign:"center",marginBottom:"1.9rem"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:".65rem",marginBottom:".45rem"}}>
            <h1 style={{fontWeight:800,fontSize:"1.55rem",color:cv.ink}}>교세특 생성 완료</h1>
            <span style={pill(cv.mintLt,cv.mint,cv.mintMd)}>✓ 완료</span>
          </div>
          <div style={{display:"flex",justifyContent:"center",gap:"1.3rem",fontSize:".84rem",color:cv.muted,flexWrap:"wrap"}}>
            <span>학생: <strong style={{color:cv.ink2}}>{submitted.stuName}</strong></span>
            <span>학번: <strong style={{color:cv.ink2}}>{submitted.stuId}</strong></span>
            <span>생성일: <strong style={{color:cv.ink2}}>{new Date().toLocaleDateString("ko-KR")}</strong></span>
          </div>
        </div>
        <div style={{...crd({padding:"2rem 2.2rem"}),position:"relative",marginBottom:"1.5rem"}}>
          <div style={{position:"absolute",top:-12,left:"1.3rem",background:cv.lavMd,padding:".1rem .58rem",fontSize:".7rem",fontWeight:700,color:cv.ink,letterSpacing:".1em",borderRadius:20}}>세부능력 및 특기사항</div>
          <p style={{fontSize:".95rem",lineHeight:2.1,color:cv.ink,whiteSpace:"pre-wrap",wordBreak:"keep-all"}}>{seteuk}</p>
          <div style={{textAlign:"right",marginTop:".9rem",paddingTop:".75rem",borderTop:`1px solid ${cv.border}`,fontSize:".78rem",color:cv.muted}}>{seteuk.length}자</div>
        </div>
        <div style={{display:"flex",gap:".8rem",flexWrap:"wrap"}}>
          <button onClick={()=>navigator.clipboard.writeText(seteuk).then(()=>alert("클립보드에 복사되었습니다!")).catch(()=>alert("복사 실패"))} style={{...btn(`linear-gradient(135deg,${cv.mint},#27ae60)`),flex:1,padding:".78rem",minWidth:100}}>📋 클립보드 복사</button>
          <button onClick={()=>{setSeteuk(null);setPage("review");}} style={{...btn("#fff",cv.ink),border:`1.5px solid ${cv.border2}`,flex:1,padding:".78rem",minWidth:100}}>↺ 다시 생성</button>
          <button onClick={reset} style={{...btn("#fff",cv.muted),border:`1px solid ${cv.border}`,flex:1,padding:".78rem",minWidth:100}}>처음으로</button>
        </div>
      </div>
    </div>
  );

  return null;
}

/* ── 서브 컴포넌트 ── */
function PoemImageManager({images,onChange}){
  const ref=useRef();
  const [editIdx,setEditIdx]=useState(null);
  const [labelInput,setLabelInput]=useState("");
  const cv2={lav:"#7c5cbf",lavLt:"#ede9ff",lavMd:"#c5b8f5",rose:"#b03060",roseLt:"#fff0f4",roseMd:"#f5b8c8",bg:"#f0f4ff",border:"#e2dcf5",border2:"#cec8ea",ink2:"#4a4560",muted:"#8882a8"};
  const b=(bg,col="#fff",ex={})=>({background:bg,color:col,border:"none",borderRadius:8,padding:".55rem 1.1rem",fontWeight:700,cursor:"pointer",fontSize:".85rem",fontFamily:"inherit",...ex});
  const inp2=(ex={})=>({width:"100%",border:`1.5px solid ${cv2.border2}`,borderRadius:8,padding:".65rem .9rem",fontSize:".92rem",outline:"none",fontFamily:"Pretendard,sans-serif",background:"#fff",...ex});
  const addImage=e=>{const f=e.target.files[0];if(!f)return;if(images.length>=3){alert("최대 3개");return;}const r=new FileReader();r.onload=ev=>onChange([...images,{dataUrl:ev.target.result,label:`시/지문 ${images.length+1}`}]);r.readAsDataURL(f);e.target.value="";};
  const removeImage=i=>{const n=[...images];n.splice(i,1);onChange(n);};
  const saveLabel=i=>{const n=[...images];n[i]={...n[i],label:labelInput};onChange(n);setEditIdx(null);};
  return(
    <div>
      <div style={{display:"flex",flexDirection:"column",gap:".6rem",marginBottom:".6rem"}}>
        {images.map((img,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:".7rem",background:cv2.bg,borderRadius:8,padding:".6rem .85rem",border:`1px solid ${cv2.border}`}}>
            <img src={img.dataUrl} alt="" style={{width:52,height:40,objectFit:"cover",borderRadius:6,border:`1px solid ${cv2.border2}`,flexShrink:0}}/>
            {editIdx===i
              ?<input autoFocus style={{...inp2(),flex:1,fontSize:".84rem",padding:".35rem .65rem"}} value={labelInput} onChange={e=>setLabelInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")saveLabel(i);if(e.key==="Escape")setEditIdx(null);}}/>
              :<span style={{flex:1,fontSize:".85rem",fontWeight:600,color:cv2.ink2}}>{img.label}</span>
            }
            {editIdx===i
              ?<button onClick={()=>saveLabel(i)} style={{...b(cv2.lav),fontSize:".75rem",padding:".3rem .7rem"}}>확인</button>
              :<button onClick={()=>{setEditIdx(i);setLabelInput(img.label);}} style={{...b(cv2.lavLt,cv2.lav),border:`1px solid ${cv2.lavMd}`,fontSize:".75rem",padding:".3rem .65rem"}}>이름 수정</button>
            }
            <button onClick={()=>removeImage(i)} style={{...b(cv2.roseLt,cv2.rose),border:`1px solid ${cv2.roseMd}`,fontSize:".75rem",padding:".3rem .65rem"}}>삭제</button>
          </div>
        ))}
      </div>
      {images.length<3&&(
        <label style={{display:"flex",alignItems:"center",gap:".5rem",padding:".65rem 1rem",background:cv2.lavLt,border:`1.5px dashed ${cv2.lavMd}`,borderRadius:8,cursor:"pointer",fontSize:".84rem",color:cv2.lav,fontWeight:700}}>
          <input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={addImage}/>📎 시/지문 이미지 추가 ({images.length}/3)
        </label>
      )}
      <div style={{fontSize:".73rem",color:cv2.muted,marginTop:".4rem"}}>등록된 이미지는 학생 활동지에서 드롭다운으로 선택 가능합니다.</div>
    </div>
  );
}

function StuImgUpload({value,onChange}){
  const ref=useRef();
  const hf=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>onChange(ev.target.result);r.readAsDataURL(f);e.target.value="";};
  return(
    <div>
      {value
        ?<div style={{position:"relative",width:"100%",marginBottom:".4rem"}}>
           <img src={value} alt="" style={{maxWidth:"100%",maxHeight:230,borderRadius:9,border:"1.5px solid #e2dcf5",display:"block"}}/>
           <button onClick={()=>onChange(null)} style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,.55)",border:"none",borderRadius:"50%",width:26,height:26,color:"#fff",cursor:"pointer",fontSize:".9rem",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
         </div>
        :<div onClick={()=>ref.current.click()} style={{border:"1.5px dashed #cec8ea",borderRadius:9,padding:"1.2rem",textAlign:"center",cursor:"pointer",background:"#fafcff",color:"#8882a8",fontSize:".86rem",lineHeight:1.7}}>
           📷 활동지 사진을 업로드하세요<br/><span style={{fontSize:".76rem"}}>이미지 파일 (jpg, png 등)</span>
         </div>
      }
      <input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={hf}/>
    </div>
  );
}

function CompCheck({label,items,sel,onChange}){
  const tog=item=>onChange(sel.includes(item)?sel.filter(x=>x!==item):[...sel,item]);
  return(
    <div style={{background:"#f8f9fc",borderRadius:9,padding:".72rem .88rem",border:"1px solid #e2dcf5"}}>
      <div style={{fontSize:".76rem",fontWeight:700,color:"#4a4560",marginBottom:".45rem"}}>{label}</div>
      {items.map(item=>(
        <label key={item} style={{display:"flex",alignItems:"center",gap:".38rem",cursor:"pointer",fontSize:".82rem",color:sel.includes(item)?"#7c5cbf":"#4a4560",fontWeight:sel.includes(item)?700:400,marginBottom:".3rem"}}>
          <input type="checkbox" checked={sel.includes(item)} onChange={()=>tog(item)} style={{accentColor:"#7c5cbf"}}/>{item}
        </label>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
